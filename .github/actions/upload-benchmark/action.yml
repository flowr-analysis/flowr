name: "Upload Benchmark"
description: "Add the results of one benchmark suite and parser to the benchmark data, with the test counters uploaded on their own"

inputs:
  suite:
    description: "The benchmark suite, `artificial` or `real-world`"
    required: true
  parser:
    description: "The parser the suite ran with, `r-shell` or `tree-sitter`"
    required: true
  token:
    description: "The token used to read and write the benchmark data"
    required: true
  ref:
    description: "The ref the benchmark data is compared against, if not the checked-out one"
    required: false
    default: ""
  mutation-results:
    description: "Whether the counters include the mutation test results"
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: "⬇️ Get benchmark Artifacts (${{ inputs.suite }}, ${{ inputs.parser }})"
      uses: actions/download-artifact@v6
      with:
        name: benchmark-results-${{ inputs.suite }}-${{ inputs.parser }}
        path: benchmark-${{ inputs.suite }}-${{ inputs.parser }}/

    - name: "🧪 Add the Test Counters (${{ inputs.suite }}, ${{ inputs.parser }})"
      shell: bash
      run: |
        mutation=""
        if [ "${{ inputs.mutation-results }}" = "true" ]; then mutation="--mutation-results test-labels/flowr-mutation-test-results.json"; fi
        bash .github/workflows/scripts/run-flowr-command.sh "benchmark:test-counts -- --results test-labels/flowr-test-results.json --mutations test-labels/flowr-mutation-details.json $mutation test-labels/flowr-test-details.json benchmark-${{ inputs.suite }}-${{ inputs.parser }}/${{ inputs.suite }}/${{ inputs.suite }}-summarized-graph-info.json"

    - name: "🥄 Merge and Produce Performance Results (${{ inputs.suite }}, ${{ inputs.parser }})"
      uses: benchmark-action/github-action-benchmark@v1
      with:
        name: '"${{ inputs.suite }}" Benchmark Suite${{ inputs.parser == ''tree-sitter'' && '' (tree-sitter)'' || '''' }}'
        tool: 'customSmallerIsBetter'
        output-file-path: benchmark-${{ inputs.suite }}-${{ inputs.parser }}/${{ inputs.suite }}/${{ inputs.suite }}-summarized-graph.json
        github-token: ${{ inputs.token }}
        fail-on-alert: false
        summary-always: true
        comment-on-alert: true
        comment-always: false
        skip-fetch-gh-pages: true
        max-items-in-chart: 100
        ref: ${{ inputs.ref }}
        gh-repository: ${{ github.repository }}
        benchmark-data-dir-path: wiki/stats/benchmark/
        auto-push: false

    # the counters are no measurement of speed, so nothing alerts on them: a release with more linting rules must
    # never read as a performance regression. The page merges the two suites back into one, see `mergeInfoSuites`
    # in `wiki/stats/benchmark/stats.js`.
    - name: "🧮 Merge and Produce the Counters (${{ inputs.suite }}, ${{ inputs.parser }})"
      uses: benchmark-action/github-action-benchmark@v1
      with:
        name: '"${{ inputs.suite }}" Benchmark Suite${{ inputs.parser == ''tree-sitter'' && '' (tree-sitter)'' || '''' }} [info]'
        tool: 'customSmallerIsBetter'
        output-file-path: benchmark-${{ inputs.suite }}-${{ inputs.parser }}/${{ inputs.suite }}/${{ inputs.suite }}-summarized-graph-info.json
        github-token: ${{ inputs.token }}
        fail-on-alert: false
        summary-always: false
        comment-on-alert: false
        comment-always: false
        alert-threshold: '100000%'
        skip-fetch-gh-pages: true
        max-items-in-chart: 100
        ref: ${{ inputs.ref }}
        gh-repository: ${{ github.repository }}
        benchmark-data-dir-path: wiki/stats/benchmark/
        auto-push: false
