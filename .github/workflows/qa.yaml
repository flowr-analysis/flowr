name: "QA"
# Runs on each push and tests flowR for the default configuration.
# Also publishes a pre-release build to npm and updates the documentation with new performance benchmarks.
# Depending on the targets, etc. this may perform a different subset of steps!

'on':
  push:
    branches-ignore:
      - 'gh-pages'
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    types: [ opened, synchronize ]
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      force-full:
        description: "Force all steps"
        required: true
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  debug:
    name:    "🔍 Debug"
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: "🛒 Checkout Repository"
        uses: actions/checkout@v6

      - name: "🌍 Load Versions to Use"
        run: bash .github/workflows/scripts/global-configuration.sh

      - name: "🔍 Debug state"
        run: |
          echo "::group::Versions"
          echo "Node Version: $ACTION_NODE_VERSION"
          echo "R Version: $ACTION_R_VERSION"
          echo "::endgroup::"          
          echo "::group::Git Info"
          echo "Event: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "Base Ref: ${{ github.base_ref }}"
          echo "Head Commit: ${{ github.sha }}"
          echo "::endgroup::"          

  lint:
    needs: [ debug ]
    name: "👩‍🏫 Linting (local)"
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.base.ref != 'main' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: "🛒 Checkout Repository"
        uses: actions/checkout@v6
        with:
            submodules: true

      - name: "🌍 Load Versions to Use"
        run: bash .github/workflows/scripts/global-configuration.sh

      - name: "⬇️ Use Node.js"
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.ACTION_NODE_VERSION }}
          registry-url: "https://registry.npmjs.org/"
          cache: npm

      - name: "🔍 Typecheck"
        run: bash .github/workflows/scripts/run-flowr-command.sh typecheck

      - name: "👩‍🏫 Run linter"
        run: bash .github/workflows/scripts/run-flowr-command.sh lint-local

  lint-main:
    needs: [ debug ]
    name: "👩‍🏫 Linting on Main"
    if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main') || github.base_ref == 'main' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: "🛒 Checkout Repository"
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: "🌍 Load Versions to Use"
        run: bash .github/workflows/scripts/global-configuration.sh

      - name: "⬇️ Use Node.js"
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.ACTION_NODE_VERSION }}
          registry-url: "https://registry.npmjs.org/"
          cache: npm

      - name: "🔍 Typecheck"
        run: bash .github/workflows/scripts/run-flowr-command.sh typecheck

      - name: "👩‍🏫 Run linter"
        run: bash .github/workflows/scripts/run-flowr-command.sh lint

  test:
    needs: [ debug ]
    name: "⚗️ Test Suite (coverage)"
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.base.ref != 'main' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 65
    steps:
      - name: "🛒 Checkout Repository"
        uses: actions/checkout@v6
        with:
            submodules: true

      - name: "🌍 Load Versions to Use"
        run: bash .github/workflows/scripts/global-configuration.sh

      - name: "⬇️ Use Node.js"
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.ACTION_NODE_VERSION }}
          registry-url: "https://registry.npmjs.org/"
          cache: npm

      - name: "⬇️ Setup R"
        uses: ./.github/actions/setup-r
        timeout-minutes: 45
        with:
          r-version: ${{ env.ACTION_R_VERSION }}
          packages: 'true'

      - name: "📦 Install Node Dependencies"
        # the sync below runs through ts-node, so the dependencies have to be there before it
        run: npm ci

      - name: "⬇️ Setup the Signature Database"
        uses: ./.github/actions/setup-sigdb
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "🧪 Run the Tests"
        run: bash .github/workflows/scripts/run-flowr-command.sh "test:full -- --allowOnly=false"

      - name: "⚙️ Run System Tests"
        run: bash .github/workflows/scripts/run-flowr-command.sh "test:system -- --no-watch"

      - name: "🧬 Run Mutation Tests"
        run: bash .github/workflows/scripts/run-flowr-command.sh "test:mutations -- --run --reporter=default --reporter=json --outputFile.json=coverage/flowr-mutation-test-results.json -- --make-summary"

      - name: "⬆️ Upload Test Label Details"
        uses: actions/upload-artifact@v6
        with:
          name: test-label-details
          path: |
            coverage/flowr-test-details*.json
            coverage/flowr-test-results.json
            coverage/flowr-mutation-details.json
            coverage/flowr-mutation-test-results.json
          if-no-files-found: warn

      - name: "⬆️ Upload Coverage Reports to Codecov"
        if: github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  test-os:
    needs: [ debug ]
    name: "🧪 Test Suite (${{ matrix.os }})"
    # the release matrix tests these as well, but by then a failure blocks the release instead of the merge
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.base.ref != 'main' }}
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: "🛒 Checkout Repository"
        uses: actions/checkout@v6
        with:
            submodules: true

      - name: "🌍 Load Versions to Use"
        run: bash .github/workflows/scripts/global-configuration.sh

      - name: "⬇️ Use Node.js"
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.ACTION_NODE_VERSION }}
          registry-url: "https://registry.npmjs.org/"
          cache: npm

      - name: "⬇️ Setup R"
        uses: ./.github/actions/setup-r
        timeout-minutes: 45
        with:
          r-version: ${{ env.ACTION_R_VERSION }}

      - name: "📦 Install R Packages"
        shell: Rscript {0}
        run: |
          wanted <- readLines(".github/actions/setup-r/packages.txt")
          install.packages(wanted, repos="https://cloud.r-project.org/")
          missing <- setdiff(wanted, rownames(installed.packages()))
          if(length(missing) > 0) cat("::warning::R", format(getRversion()), "lacks", missing, "so the tests that load them skip\n")

      - name: "⬇️ Setup the Signature Database"
        uses: ./.github/actions/setup-sigdb
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "🧪 Run the Tests"
        run: bash .github/workflows/scripts/run-flowr-command.sh "test -- --run --allowOnly=false"


  performance-test:
    needs: [ test ]
    name: "⏱️ Performance Test"
    # we do not run if the release workflow runs it with pushing
    if: ${{
              !cancelled()
          && !failure()
          && (inputs.force-full || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
          && !(
                startsWith(github.event.head_commit.message, '[release:minor]') ||
                startsWith(github.event.head_commit.message, '[release:major]') ||
                startsWith(github.event.head_commit.message, '[release:patch]')
              )
      }}
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    strategy:
      fail-fast: true
      matrix:
        # currently we have a duplication, add your benchmark names here and in `performance-test-upload`
        name: ['artificial', 'real-world']
        parser: ["tree-sitter", "r-shell"]
    steps:
      - name: "🛒 Checkout Repository"
        uses: actions/checkout@v6
        with:
            submodules: true

      - name: "🌍 Load Versions to Use"
        run: bash .github/workflows/scripts/global-configuration.sh

      - name: "⬇️ Use Node.js"
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.ACTION_NODE_VERSION }}
          registry-url: "https://registry.npmjs.org/"
          cache: npm

      - name: "⬇️ Setup R"
        uses: ./.github/actions/setup-r
        timeout-minutes: 45
        with:
          r-version: ${{ env.ACTION_R_VERSION }}

      - name: "⏱️ Run the performance benchmarks"
        run: bash .github/workflows/scripts/run-flowr-command.sh test:performance -- 1 1 "${{ matrix.name }}" "${{ matrix.parser }}"

      - name: "⬆️ Upload Benchmark Results"
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-results-${{ matrix.name }}-${{ matrix.parser }}
          path: test/performance/results/
          if-no-files-found: error

  performance-test-upload:
    name: "⬆️ Upload Performance Test Results"
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    needs: [ performance-test ]
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v6
        with:
          submodules: true
          token:      ${{ secrets.RELEASE_TOKEN }}

      - name: "⚙️ Name and Email for Git (config)"
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: "🌍 Load Versions to Use"
        run: bash .github/workflows/scripts/global-configuration.sh

      - name: "⬇️ Use Node.js"
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.ACTION_NODE_VERSION }}
          cache: npm

      - name: "⬇️ Get the Test Label Details"
        uses: actions/download-artifact@v6
        continue-on-error: true
        with:
          name: test-label-details
          path: test-labels/

      # add new benchmark suites and parsers here and in the matrix of `performance-test`
      - name: "⬆️ Benchmark (artificial, r-shell)"
        uses: ./.github/actions/upload-benchmark
        with:
          suite:  artificial
          parser: r-shell
          token:  ${{ secrets.GITHUB_TOKEN }}
          ref:    "refs/heads/main"

      - name: "⬆️ Benchmark (artificial, tree-sitter)"
        uses: ./.github/actions/upload-benchmark
        with:
          suite:  artificial
          parser: tree-sitter
          token:  ${{ secrets.GITHUB_TOKEN }}
          ref:    "refs/heads/main"

      - name: "⬆️ Benchmark (real-world, r-shell)"
        uses: ./.github/actions/upload-benchmark
        with:
          suite:  real-world
          parser: r-shell
          token:  ${{ secrets.GITHUB_TOKEN }}
          ref:    "refs/heads/main"

      - name: "⬆️ Benchmark (real-world, tree-sitter)"
        uses: ./.github/actions/upload-benchmark
        with:
          suite:  real-world
          parser: tree-sitter
          token:  ${{ secrets.GITHUB_TOKEN }}
          ref:    "refs/heads/main"

      - name: "⬆️ Upload Benchmark Graph Data"
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-results-graph-data
          path: wiki/stats/benchmark/
          retention-days: 1
