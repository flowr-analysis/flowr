<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flowR &middot; signature database</title>
<meta name="description" content="Search the R functions flowR knows: <!--FUNCTIONS--> exported names from <!--PACKAGES--> base-R and CRAN packages, the database behind its sophisticated call resolution.">
<link rel="icon" href="../img/flowR-mark-red.svg" type="image/svg+xml">
<link rel="search" type="application/opensearchdescription+xml" title="flowR sigdb" href="opensearch.xml">
<!--CHROME-SCRIPT-->
<style>
<!--THEME-CSS-->
<!--BASE-CSS-->
body { display: flex; flex-direction: column; min-height: 100vh; }
main { max-width: 62rem; margin: 0 auto; width: 100%; flex: 1 0 auto; }
h1 { font-size: clamp(1.5rem, 5vw, 2.1rem); line-height: 1.2; letter-spacing: -.02em; margin: 1.4rem 0 .4rem; }
code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

<!--BAR-CSS-->
footer { margin: 3.5rem auto 1.5rem; max-width: 62rem; width: 100%; flex: none; }
<!--FOOTER-CSS-->

p.lead { color: var(--muted); margin: 0 0 1.2rem; }
.when { font-size: .9em; }
.search { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
.search input {
	flex: 1 1 18rem; font: inherit; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
	padding: .7rem .9rem; border-radius: .6rem; border: 1px solid var(--border);
	background: var(--panel); color: var(--fg); box-shadow: var(--shadow);
}
.search input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.search select { font: inherit; padding: .7rem .6rem; border-radius: .6rem; border: 1px solid var(--border); background: var(--panel); color: var(--fg); }
#status { min-height: 1.6em; margin: .7rem 0 0; color: var(--muted); font-size: .9rem; }
.filters { display: flex; flex-wrap: wrap; gap: .35rem; margin: .8rem 0 0; }
.filters button {
	font: inherit; font-size: .74rem; padding: .2rem .6rem; cursor: pointer; border-radius: 1rem;
	border: 1px solid var(--border); background: var(--panel); color: var(--muted);
	transition: color .12s, border-color .12s, background .12s;
}
.filters button:hover:not(:disabled) { color: var(--fg); border-color: var(--accent); }
.filters button:disabled { opacity: .4; cursor: default; }
.mix { order: 2; margin-left: auto; display: flex; align-items: center; gap: .45rem; }
.mixlabel, .filterlabel { font-size: .72rem; color: var(--muted); }
.filterlabel { align-self: center; margin-right: .1rem; }
#scope {
	font: inherit; font-size: .76rem; font-weight: 600; cursor: pointer; padding: .22rem .7rem;
	border-radius: 1rem; border: 1px solid transparent; background: var(--accent); color: var(--accent-fg);
}
#scope:hover { filter: brightness(1.08); }
#scope[hidden] { display: none; }
.mix .track { display: inline-flex; gap: .1rem; padding: .16rem; border-radius: 999px; border: 1px solid var(--border); background: var(--sunk); }
.mix .pick { font: inherit; font-size: .74rem; line-height: 1.5; cursor: pointer; color: var(--muted); border-radius: 999px; border: 0; background: none; padding: .16rem .6rem; }
.mix .pick[aria-pressed="true"] { color: var(--accent); background: var(--panel); border-color: transparent; }
.filters button[aria-pressed="true"] { color: var(--accent-fg); background: var(--accent); border-color: transparent; }

/* minmax(0, 1fr), not the implicit auto: a track sized to its content would let a long signature push the row past the page */
#hits { list-style: none; margin: 1rem 0 0; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: .4rem; }
#hits li {
	padding: .55rem .8rem; border: 1px solid var(--border); border-radius: .6rem; background: var(--panel);
	transition: border-color .12s; cursor: pointer; min-width: 0;
}
/* one line per hit: the signature is the part that gives way, so nothing else is pushed onto a line of its own */
#hits .head { display: flex; flex-wrap: nowrap; gap: .3rem .8rem; align-items: baseline; min-width: 0; }
#hits .head > :not(.stated) { flex: none; }
#hits .detail { margin-top: .55rem; border-top: 1px solid var(--border); padding-top: .55rem; }
#hits .detail p { margin: .1rem 0; font-size: .85rem; }
#hits .pkghit .detail p {
	display: grid; grid-template-columns: minmax(0, 9rem) minmax(0, 1fr); gap: .8rem; align-items: baseline; color: var(--fg);
}
#hits .pkghit .detail .kind { color: var(--muted); }
#hits .detail .links { display: flex; gap: 1.2rem; margin-top: .6rem; }
#hits .detail .links a { font-size: .85rem; }
#hits .owns { display: grid; gap: .1rem; max-height: 19rem; overflow-y: auto; }
#hits .src {
	font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .72rem;
	color: var(--muted); text-decoration: none; justify-self: end;
	min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 16rem;
}
#hits .src:hover { color: var(--accent); text-decoration: underline; }
/* the same separator the version already uses between itself and its download count */
#hits .own .src + .ver::before { content: '· '; }
#hits .src.nofile { font-style: italic; opacity: .7; }
#hits .own .pkg, #hits .own .go { text-decoration: none; color: inherit; }
#hits .own .pkg:hover { color: var(--accent); }
#hits .own {
	display: grid; grid-template-columns: minmax(0, auto) minmax(0, 1fr) minmax(0, auto) auto minmax(4.2rem, auto) 1rem;
	gap: .8rem; align-items: baseline;
	padding: .3rem .5rem; border-radius: .4rem; text-decoration: none; color: var(--fg); font-size: .85rem;
	cursor: pointer;
}
#hits .own:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
#hits .own.undocumented { color: var(--muted); opacity: .55; }
#hits .own.undocumented .go { opacity: .5; }
#hits .pkg { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight: 600; }
#hits .ver, #hits .go { color: var(--muted); font-size: .78rem; }
/* a long name or a version with its download count next to it gives way rather than running into the column beside it */
#hits .pkg, #hits .ver { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#hits .tag {
	justify-self: start; padding: 0 .45rem; border-radius: 1rem; font-size: .68rem; font-weight: 600;
	letter-spacing: .03em; color: var(--muted); border: 1px solid var(--border);
}
#hits .own:hover .go { color: var(--accent); }
#hits .flags { display: flex; flex-wrap: wrap; gap: .3rem; min-width: 0; }
#hits .pkghit { border-style: dashed; }
#hits .pkghit .owners { color: var(--muted); font-size: .78rem; }
/* every badge is the same pill whatever it says, so only its colour carries the difference */
#hits .kindtag, #hits .flag {
	display: inline-flex; align-items: center; white-space: nowrap;
	padding: .1rem .5rem; border-radius: 1rem; border: 1px solid transparent;
	font-size: .7rem; line-height: 1.35; letter-spacing: .02em;
}
#hits .kindtag {
	font-weight: 600;
	color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent);
	border-color: color-mix(in srgb, var(--accent) 35%, transparent);
}
#hits .generic { font-size: .74rem; text-decoration: none; color: var(--muted); }
#hits .generic:hover { color: var(--accent); text-decoration: underline; }
#hits .flag {
	font-weight: 500;
	color: var(--muted); background: var(--sunk); border-color: var(--border);
}
#hits .ask {
	display: flex; flex-wrap: wrap; gap: .5rem; align-items: baseline; margin: .5rem 0 0;
	color: var(--muted); font-size: .78rem; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
#hits .ask::after { content: ""; } /* the command itself is the text node after the label */
#hits .ask span { font-family: system-ui, sans-serif; }
#hits li:hover { border-color: var(--accent); }
#hits .name { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight: 600; }
#hits .name.value { font-weight: 500; font-style: italic; }
#hits .kindtag.value { color: var(--muted); background: var(--sunk); border-color: var(--border); }
#hits .kindtag.flowr { color: var(--muted); background: var(--panel); border-color: var(--border); font-weight: 500; }
#hits .kindtag.gone { color: #d55e00; background: color-mix(in srgb, #d55e00 10%, transparent); border-color: color-mix(in srgb, #d55e00 35%, transparent); }
/* what flowR states about the name, next to what the database says about it */
#hits .kindtag.props { border-style: dashed; opacity: .8; }
#hits .flag.stated { border-style: dashed; color: var(--accent); }
/* stated: as wide as what it says and no wider, an ellipsis only once the line runs out; inline-flex so its own parts (kind/args/ret) lay out beside it */
#hits .stated {
	font-size: .78rem; color: var(--muted); background: var(--sunk);
	padding: .05rem .35rem; border-radius: .3rem; white-space: nowrap;
	overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; min-width: 0;
	display: inline-flex; align-items: baseline; vertical-align: bottom;
}
/* the formals are what may be cut: without min-width a flex item never shrinks below what it says, and the row would grow past the panel */
#hits .stated .args { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 0 1 auto; min-width: 0; }
/* what the call does is the part worth keeping when the formals no longer fit */
#hits .stated .ret, #hits .stated .kind { flex: none; }
#hits .stated .role { font-style: normal; color: color-mix(in srgb, var(--accent) 75%, var(--muted)); }
#hits .stated .ret { font-style: normal; color: color-mix(in srgb, var(--fg) 45%, var(--muted)); }
#hits .stated .kind { font-style: normal; color: color-mix(in srgb, var(--muted) 80%, transparent); }
#hits .owners { margin-left: auto; display: flex; flex-wrap: wrap; gap: .3rem; flex: none; }
#hits .owners a {
	font-size: .78rem; text-decoration: none; padding: .1rem .45rem; border-radius: .8rem;
	border: 1px solid var(--border); color: var(--muted); background: var(--sunk);
}
#hits .owners a:hover { border-color: var(--accent); color: var(--accent); }
#hits .owners a.base { border-style: dashed; border-color: color-mix(in srgb, var(--fg) 30%, transparent); color: var(--fg); background: transparent; }
#hits mark { background: color-mix(in srgb, var(--accent) 28%, transparent); color: inherit; border-radius: .2rem; }
.more-hits {
	justify-self: center; margin: .6rem 0 0; font: inherit; font-size: .8rem; font-weight: 600;
	padding: .4rem 1.4rem; border-radius: 1rem; cursor: pointer;
	border: 1px solid var(--border); background: var(--panel); color: var(--muted);
}
.more-hits:hover { color: var(--accent); border-color: var(--accent); }
.more { font: inherit; font-size: .78rem; color: var(--muted); background: none; border: 0; cursor: pointer; padding: .1rem .3rem; }
.more:hover { color: var(--accent); }
</style>
</head>
<body>
<main>

<div class="bar">
	<h2><a class="brand" href="../../"><img class="mark" src="../img/flowR-mark-red.svg" alt="" width="26" height="26">flowR</a><span class="where">Signature DB</span><!--VERSION-LINK--></h2>
	<nav>
		<!--NAV:sigdb-->
	</nav>
	<span class="controls">
		<!--CONTROLS:sigdb-->
	</span>
</div>

<h1>Signature Database</h1>
<p class="lead">
	Search through all R functions flowR knows, using its
	<a href="https://github.com/flowr-analysis/flowr/wiki/Signature-Database" target="_blank" rel="noopener">signature database</a>
	<span class="when">(last updated <!--UPDATED-->, only most recent package versions)</span>.
</p>

<div class="search">
	<input id="q" type="search" spellcheck="false" autocomplete="off" autofocus placeholder="dplyr::filter" aria-label="Function name">
	<select id="sort" aria-label="How to sort">
		<option value="auto">best match</option>
		<option value="best">closest match</option>
	</select>
	<select id="mode" aria-label="How to match">
		<option value="fuzzy">fuzzy</option>
		<option value="prefix">starts with</option>
		<option value="contains">contains</option>
	</select>
</div>
<div class="filters" id="filters">
	<span class="filterlabel">filter:</span>
	<button type="button" id="scope" hidden></button>
	<span class="mix">
		<span class="mixlabel">match</span>
		<span class="track" role="group" aria-label="How the filters combine">
			<button type="button" class="pick" data-mix="all" aria-pressed="true">all</button>
			<button type="button" class="pick" data-mix="any" aria-pressed="false">any</button>
			<button type="button" class="pick" data-mix="none" aria-pressed="false">none</button>
		</span>
	</span>
</div>
<p id="status">Type a name to search.</p>
<ul id="hits"></ul>

</main>
<script type="text/plain" id="data"><!--DATA--></script>
<script type="application/json" id="kinds">"<!--KINDS-->"</script>
<script type="application/json" id="stated">"<!--STATED-->"</script>
<script type="application/json" id="topics">"<!--TOPICS-->"</script>
<script type="application/json" id="formals">"<!--FORMALS-->"</script>
<script type="application/json" id="groups">"<!--GROUPS-->"</script>
<script type="application/json" id="generics">"<!--GENERICS-->"</script>
<!--FOOTER:sigdb-->
<script type="application/json" id="topics-complete"><!--TOPICS-COMPLETE--></script>
<script>
<!--MAIN-SCRIPT-->

</script>
<!--VERSION-SCRIPT-->
</body>
</html>
