<style>
:root {
	--bg: #fbfbfc; --panel: #fff; --sunk: #f1f3f6; --fg: #1b1d21; --muted: #5c6270;
	--border: #d6dae1; --accent: #0072b2; --accent-fg: #fff;
	--shadow: 0 1px 2px rgba(16,20,30,.06), 0 6px 18px rgba(16,20,30,.06);
	color-scheme: light;
}
:root[data-theme="dark"] {
	--bg: #14161a; --panel: #1b1e24; --sunk: #22262d; --fg: #e7e9ed; --muted: #a3aab8;
	--border: #2f343d; --accent: #56b4e9; --accent-fg: #10131a;
	--shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35); color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
	:root:not([data-theme="light"]) {
		--bg: #14161a; --panel: #1b1e24; --sunk: #22262d; --fg: #e7e9ed; --muted: #a3aab8;
		--border: #2f343d; --accent: #56b4e9; --accent-fg: #10131a;
		--shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35); color-scheme: dark;
	}
}
* { box-sizing: border-box; }
body {
	margin: 0; padding: 0 1rem 3rem; color: var(--fg); -webkit-text-size-adjust: 100%;
	font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
	background: radial-gradient(64rem 24rem at 50% -10rem, color-mix(in srgb, var(--accent) 12%, transparent), transparent 70%) var(--bg) no-repeat;
}
main { max-width: 62rem; margin: 0 auto; }
a { color: var(--accent); }
h1 { font-size: clamp(1.5rem, 5vw, 2.1rem); line-height: 1.2; letter-spacing: -.02em; margin: 1.4rem 0 .4rem; }
code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

.bar {
	display: flex; gap: .5rem 1rem; align-items: center; justify-content: space-between;
	padding: .8rem 0 .6rem; border-bottom: 1px solid var(--border);
}
.bar h2 { margin: 0; flex: none; font-size: 1.15rem; line-height: 1.2; }
.bar h2 a { display: inline-flex; align-items: center; gap: .45rem; text-decoration: none; }

.bar nav { display: flex; flex-wrap: nowrap; gap: .1rem .2rem; margin-left: auto; overflow-x: auto; scrollbar-width: none; }
.bar nav::-webkit-scrollbar { display: none; }
.bar nav a { white-space: nowrap; padding: .3rem .5rem; border-radius: .4rem; color: var(--muted); text-decoration: none; font-size: .82rem; }
.bar nav a:hover { background: color-mix(in srgb, var(--fg) 6%, transparent); color: var(--fg); }
#theme {
	display: grid; place-items: center; width: 2rem; height: 2rem; padding: 0; flex: none;
	font: inherit; font-size: 1rem; line-height: 1; cursor: pointer;
	border-radius: .5rem; border: 1px solid var(--border); background: var(--panel); color: var(--fg);
}
#theme:hover { border-color: var(--accent); color: var(--accent); }
#theme svg { display: block; }
#theme .sun { display: none; }
:root[data-theme="dark"] #theme .sun { display: block; }
:root[data-theme="dark"] #theme .moon { display: none; }
@media (prefers-color-scheme: dark) {
	:root:not([data-theme="light"]) #theme .sun { display: block; }
	:root:not([data-theme="light"]) #theme .moon { display: none; }
}

p.lead { color: var(--muted); margin: 0 0 1.2rem; }
.search { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
.search input {
	flex: 1 1 18rem; font: inherit; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
	padding: .7rem .9rem; border-radius: .6rem; border: 1px solid var(--border);
	background: var(--panel); color: var(--fg); box-shadow: var(--shadow);
}
.search input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.search select { font: inherit; padding: .7rem .6rem; border-radius: .6rem; border: 1px solid var(--border); background: var(--panel); color: var(--fg); }
#status { min-height: 1.6em; margin: .7rem 0 0; color: var(--muted); font-size: .9rem; }

.filters button {
	font: inherit; font-size: .74rem; padding: .2rem .6rem; cursor: pointer; border-radius: 1rem;
	border: 1px solid var(--border); background: var(--panel); color: var(--muted);
	transition: color .12s, border-color .12s, background .12s;
}

.filters button:disabled { opacity: .4; cursor: default; }
.mix { order: 2; margin-left: auto; display: flex; align-items: center; gap: .45rem; }
.mixlabel { font-size: .72rem; color: var(--muted); }
#scope {
	font: inherit; font-size: .76rem; font-weight: 600; cursor: pointer; padding: .22rem .7rem;
	border-radius: 1rem; border: 1px solid transparent; background: var(--accent); color: var(--accent-fg);
}
#scope:hover { filter: brightness(1.08); }
#scope[hidden] { display: none; }

.mix .pick { font: inherit; font-size: .74rem; line-height: 1.5; cursor: pointer; color: var(--muted); border-radius: 999px; padding: .1rem .55rem; }
.mix .pick { border: 0; background: none; padding: .16rem .6rem; }
.mix .pick[aria-pressed="true"] { color: var(--accent); background: var(--panel); border-color: transparent; }

}
#hits .head { display: flex; flex-wrap: wrap; gap: .3rem .8rem; align-items: baseline; }
#hits .detail { margin-top: .55rem; border-top: 1px solid var(--border); padding-top: .55rem; }
#hits .detail p { margin: .1rem 0; font-size: .85rem; }

	display: grid; grid-template-columns: 9rem 1fr; gap: .8rem; align-items: baseline; color: var(--fg);
}

#hits .detail .links { display: flex; gap: 1.2rem; margin-top: .6rem; }
#hits .detail .links a { font-size: .85rem; }

	padding: .3rem .5rem; border-radius: .4rem; text-decoration: none; color: var(--fg); font-size: .85rem;

#hits .own.undocumented { color: var(--muted); cursor: default; }
#hits .own.undocumented .go { opacity: .5; }

}
#hits .own:hover .go { color: var(--accent); }
#hits .flags { display: flex; flex-wrap: wrap; gap: .3rem; }
#hits .pkghit { border-style: dashed; }

}
#hits .generic { font-size: .74rem; text-decoration: none; color: var(--muted); }
#hits .generic:hover { color: var(--accent); text-decoration: underline; }
#hits .flag {
	padding: 0 .4rem; border-radius: 1rem; font-size: .68rem; letter-spacing: .02em;
	color: var(--muted); background: var(--sunk); border: 1px solid var(--border);
}
#hits .ask {
	display: flex; flex-wrap: wrap; gap: .5rem; align-items: baseline; margin: .5rem 0 0;
	color: var(--muted); font-size: .78rem;
}
#hits .ask::after {
	content: ""; /* the command itself is the text node after the label */
}
#hits .ask { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
#hits .ask span { font-family: system-ui, sans-serif; }
#hits li:hover { border-color: var(--accent); }
#hits .name { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight: 600; }
#hits .name.value { font-weight: 500; font-style: italic; }
#hits .kindtag.value { color: var(--muted); background: var(--sunk); border-color: var(--border); }
#hits .kindtag.gone { color: #d55e00; background: color-mix(in srgb, #d55e00 10%, transparent); border-color: color-mix(in srgb, #d55e00 35%, transparent); }
#hits .owners { margin-left: auto; display: flex; flex-wrap: wrap; gap: .3rem; }
#hits .owners a {
	font-size: .78rem; text-decoration: none; padding: .1rem .45rem; border-radius: .8rem;
	border: 1px solid var(--border); color: var(--muted); background: var(--sunk);
}
#hits .owners a:hover { border-color: var(--accent); color: var(--accent); }
#hits .owners a.base { border-style: dashed; border-color: color-mix(in srgb, var(--fg) 30%, transparent); color: var(--fg); background: transparent; }
#hits mark { background: color-mix(in srgb, var(--accent) 28%, transparent); color: inherit; border-radius: .2rem; }
.more-hits {
	justify-self: center; margin: .6rem 0 0; font: inherit; font-size: .8rem; font-weight: 600;

}

.more { font: inherit; font-size: .78rem; color: var(--muted); background: none; border: 0; cursor: pointer; padding: .1rem .3rem; }
.more:hover { color: var(--accent); }
</style>

<main>

<div class="bar">

	<nav>

	</button>

<h1>Signature database</h1>
<p class="lead">Search what flowR knows about any R function. The database it ships covers CRAN up to <!--UPDATED-->.</p>

<div class="search">
	<input id="q" type="search" spellcheck="false" autocomplete="off" autofocus placeholder="dplyr::filter" aria-label="Function name">
	<select id="sort" aria-label="How to sort">
		<option value="auto">best match</option>
		<option value="best">closest match</option>
	</select>
	<select id="mode" aria-label="How to match">
		<option value="fuzzy">fuzzy</option>
		<option value="prefix">starts with</option>
		<option value="contains">contains</option>
	</select>
</div>
<div class="filters" id="filters">
	<button type="button" id="scope" hidden></button>
	<span class="mix">
		<span class="mixlabel">match</span>
		<span class="track" role="group" aria-label="How the filters combine">
			<button type="button" class="pick" data-mix="all" aria-pressed="true">all</button>
			<button type="button" class="pick" data-mix="any" aria-pressed="false">any</button>
			<button type="button" class="pick" data-mix="none" aria-pressed="false">none</button>
		</span>
	</span>
</div>
<p id="status">Type a name to search.</p>
<ul id="hits"></ul>

</main>
<script type="text/plain" id="data"><!--DATA--></script>
<script type="application/json" id="kinds">"<!--KINDS-->"</script>
<script>
'use strict';
const theme = document.getElementById('theme');
theme.addEventListener('click', () => {
	const dark = matchMedia('(prefers-color-scheme: dark)').matches;
	const next = (document.documentElement.dataset.theme || (dark ? 'dark' : 'light')) === 'dark' ? 'light' : 'dark';
	document.documentElement.dataset.theme = next;
	try { localStorage.setItem('flowr-theme', next); } catch(e) { /* private mode forgets the choice */ }
});

/* The table is unpacked once, on the first search, so opening the page stays cheap. */
let packages = null, names = null, known = null, byName = null;
async function unpack() {
	const raw = Uint8Array.from(atob(document.getElementById('data').textContent.trim()), c => c.charCodeAt(0));
	const stream = new Blob([raw]).stream().pipeThrough(new DecompressionStream('gzip'));
	/* split at the first blank line only: a stray one further in must not cut the package table short */
	const text = await new Response(stream).text();
	const between = text.indexOf('\n\n');
	const nameBlob = text.slice(0, between), packageBlob = text.slice(between + 2);
	names = nameBlob.split('\n');
	packages = packageBlob.split('\n').map(line => line.split('\t'));
	known = new Set(names.map(line => line.slice(0, line.indexOf('\t'))));
	/* a package name back to its row, so `dplyr::` can be answered without scanning the table */
	byName = new Map(packages.map(([name], index) => [name, index]));
}

const q = document.getElementById('q'), mode = document.getElementById('mode');
const sort = document.getElementById('sort');
const Filters = [
	['only', 'package', 'package'],
	['flag', 't', 'throws'], ['flag', 'n', 'non-deterministic'], ['flag', '3', 'S3 method'],
	['flag', 'x', 'deprecated'], ['flag', 'v', 'value'],
	['kind', 'read', 'reads'], ['kind', 'write', 'writes'],
	['kind', 'visualize', 'plots'], ['kind', 'library', 'loads']
];
const active = new Set();
const filters = document.getElementById('filters');
const scope = document.getElementById('scope');
scope.addEventListener('click', () => {
	q.value = q.value.replace(/^[\w.]+:::?/, '');
	void search();
});
const picks = [...document.querySelectorAll('.pick')];
let how = 'all';
const buttons = new Map();
for(const [what, key, label] of Filters) {
	const button = document.createElement('button');
	button.type = 'button';
	button.textContent = label;
	button.setAttribute('aria-pressed', 'false');
	button.addEventListener('click', () => {
		const id = what + ':' + key;
		active.has(id) ? active.delete(id) : active.add(id);
		button.setAttribute('aria-pressed', String(active.has(id)));
		void search();
	});
	buttons.set(what + ':' + key, button);
	filters.append(button);
}
for(const pick of picks) {
	pick.addEventListener('click', () => {
		how = pick.dataset.mix;
		picks.forEach(other => other.setAttribute('aria-pressed', String(other === pick)));
		void search();
	});
}

/** drops every active filter, which is what asking for a whole package means */
function clearFilters() {
	active.clear();
	for(const button of buttons.values()) {
		button.setAttribute('aria-pressed', 'false');
	}
}

/** does one filter hold for this name? */
function holds(id, name, owners) {
	const [what, key] = id.split(':');
	if(what === 'only') {
		return false;   // it selects what is listed, not which names qualify
	}
	return what === 'kind'
		? (kinds.get(name) ?? []).includes(key)
		: owners.some(entry => owner(entry).flags.includes(key));
}

/** `all of` wants every active filter, `any of` wants one of them */
function passes(name, owners) {
	if(active.size === 0) {
		return true;
	}
	const matched = [...active].filter(id => holds(id, name, owners)).length;
	return how === 'any' ? matched > 0 : how === 'none' ? matched === 0 : matched === active.size;
}

/** a filter that would leave nothing behind is greyed out rather than silently emptying the list */
function offerFilters(matches) {
	for(const [id, button] of buttons) {
		/* `match none` is about what to exclude, so a filter that matches nothing is still useful there */
		const would = id.startsWith('only:') || how === 'none' || matches.some(([name, , owners]) => holds(id, name, owners.split(',')));
		button.disabled = !would && !active.has(id);
	}
}
const status = document.getElementById('status'), hits = document.getElementById('hits');
const Step = 200;
let limit = Step;

/** a name with the matched part marked, built as nodes so a function name can never inject markup */
/** `%o%` and friends have no `man/<name>.html`, so nothing is linked for them */
function documented(name, flags) {
	return /^[A-Za-z.][A-Za-z0-9._-]*$/.test(name) && !flags.includes('u');
}

/** where a package documents itself, for a name that has no page of its own */
function packageDocUrl(index) {
	const [pkg, , base] = packages[index];
	/* rdrr.io has no index page for a base package, but the R manual does */
	return base === '1' ? 'https://stat.ethz.ch/R-manual/R-devel/library/' + encodeURIComponent(pkg) + '/html/00Index.html'
		: 'https://rdrr.io/cran/' + encodeURIComponent(pkg) + '/';
}

function docUrl(name, entry) {
	const { index, topic } = typeof entry === 'object' ? entry : { index: entry };
	const [pkg, , base] = packages[index];
	const page = encodeURIComponent(topic ?? name);
	return base === '1' ? 'https://rdrr.io/r/' + encodeURIComponent(pkg) + '/' + page + '.html'
		: 'https://rdrr.io/cran/' + encodeURIComponent(pkg) + '/man/' + page + '.html';
}

function marked(name, needle, at) {
	const span = document.createElement('span');
	span.className = 'name';
	span.title = 'click for every package that exports ' + name;
	if(at < 0) {
		/* a fuzzy hit matches scattered characters; neighbours join into one mark so `filter` reads as
		   one highlight rather than six boxes in a row */
		const wanted = needle.toLowerCase();
		let next = 0, run = '', plain = '';
		const flush = () => {
			if(run) {
				const one = document.createElement('mark');
				one.textContent = run;
				span.append(one);
				run = '';
			}
		};
		for(const c of name) {
			if(next < wanted.length && c.toLowerCase() === wanted[next]) {
				span.append(plain);
				plain = '';
				run += c;
				next++;
			} else {
				flush();
				plain += c;
			}
		}
		flush();
		span.append(plain);
		return span;
	}
	span.append(name.slice(0, at));
	const hit = document.createElement('mark');
	hit.textContent = name.slice(at, at + needle.length);
	span.append(hit, name.slice(at + needle.length));
	return span;
}

/**
 * What a reader most likely meant: a well-used package first, base R ahead of CRAN, and the things one
 * rarely searches for last, which are S3 methods, `%operators%` and names that start with a dot.
 */
function score(name, owners, rank, needle) {
	const first = owner(owners.split(',')[0]);
	const pkg = packages[first.index];
	/* how well it matches comes first, then how short it is; popularity only settles what is left */
	/* length only matters against something typed: with an empty box it would rank `AIC` above `mean` */
	let points = -rank * 150 - (needle ? name.length * 12 : 0)
		+ Math.min(Math.log10(Number(pkg?.[3] ?? 0) + 10), 8) * (needle ? 4 : 12);
	/* what was typed, exactly, always comes first */
	if(name === needle) {
		points += 1200;
	} else if(name.toLowerCase() === needle.toLowerCase()) {
		points += 900;
	}
	/* a real function from base R is what a reader usually means; a lone symbol almost never is */
	if(pkg?.[2] === '1' && name.length >= 3) {
		points += 40;
	}
	if(first.flags.includes('v')) {
		points -= 20;
	}
	if(name.length < 3) {
		points -= 40;
	}
	/* `names<-` is the replacement form of `names`, and nobody searches for it first */
	if(name.endsWith('<-')) {
		points -= 35;
	}
	if(name.includes('.') && !needle.includes('.')) {
		points -= 45;
	}
	/* `base` itself before the packages that merely ship with R */
	if(pkg?.[0] === 'base') {
		points += 20;
	}
	/* a name flowR recognises outranks a closer spelling it knows nothing about: typing `plot` should
	   offer `ggplot` before `plotH`, because one of them is a function people actually call */
	if(kinds.has(name)) {
		points += 500;
	}
	if(first.flags.includes('3')) {
		points -= 30;
	}
	/* operators, punctuation and SHOUTING names are rarely what someone is looking for */
	if(/^%.*%$/.test(name) || /^[^\w.]/.test(name)) {
		points -= 60;
	}
	if(name === name.toUpperCase() && /[A-Z]/.test(name) && name !== needle) {
		points -= 30;
	}
	if(name.startsWith('.')) {
		points -= 400;
	}
	return points;
}

/** every character of the needle, in order but not necessarily adjacent: `rcsv` finds `read.csv` */
function fuzzy(name, needle) {
	let at = 0;
	for(const c of needle) {
		at = name.indexOf(c, at) + 1;
		if(at === 0) {
			return false;
		}
	}
	return true;
}

/** what the letters in an owner entry mean, spelled out for the reader */
const FlagNames = {
	t: 'can throw', 3: 'S3 method', n: 'non-deterministic', d: 'calls something deprecated',
	r: 'recursive', i: 'calls internals', o: 'owns an S3 class', 4: 'owns an S4 class',
	h: 'higher order', x: 'deprecated', v: 'value', u: 'no manual page'
};

/** an owner reads `12`, or `12:tn:4:topic`: package, flags, parameter count, and the help topic */
function owner(entry) {
	const [index, flags, params, topic] = String(entry).split(':');
	return {
		index:  Number(index),
		flags:  [...(flags ?? '')],
		params: Number(params) || 0,
		topic:  topic ? decodeURIComponent(topic) : undefined
	};
}

/* a Map, not the parsed object: R exports names like `toString`, and those would hit Object's prototype */
const kinds = new Map(Object.entries(JSON.parse(document.getElementById('kinds').textContent)));
/** how flowR describes what one of its known functions does */
const KindNames = {
	library: 'can load a package', source: 'can source a file', read: 'can read a file',
	write: 'can write a file', visualize: 'can draw a plot', test: 'a test', remote: 'can use the network',
	builtin: 'flowR'
};

/** CRAN downloads over the last month (what `cran_downloads(when = "last-month")` reported) */
function count(downloads) {
	const n = Number(downloads);
	return (n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? Math.round(n / 1e3) + 'k' : String(n)) + '/month';
}

function ownerLink(index) {
	const [name, version, base] = packages[index];
	const link = document.createElement('a');
	link.target = '_blank';
	link.rel = 'noopener';
	link.textContent = name;
	link.title = name + ' ' + version + (base === '1' ? ' (base R, always available)' : '');
	link.className = base === '1' ? 'base' : '';
	link.href = base === '1' ? 'https://stat.ethz.ch/R-manual/R-devel/library/' + encodeURIComponent(name) + '/html/00Index.html'
		: 'https://cran.r-project.org/package=' + encodeURIComponent(name);
	return link;
}

const Shown = 6;

/** one aligned row per owning package, each one a link to that package's manual page for this name */
function detail(name, owners) {
	const box = document.createElement('div');
	box.className = 'detail';
	const list = document.createElement('div');
	list.className = 'owns';
	for(const entry of owners) {
		const { index, flags, topic } = owner(entry);
		if(packages[index] === undefined) {
			continue;   // an index the table does not have: never expected, never fatal
		}
		const [pkg, version, base, downloads] = packages[index];
		const row = document.createElement('a');
		row.className = 'own';
		row.target = '_blank';
		row.rel = 'noopener';
		if(documented(name, flags)) {
			row.href = docUrl(name, { index, topic });
			row.title = 'the manual page for ' + name + ' in ' + pkg;
		} else {
			/* no page of its own, so the package's documentation is the next best thing */
			row.href = packageDocUrl(index);
			row.classList.add('undocumented');
			row.title = name + ' has no manual page in ' + pkg + ', so this links to the package documentation';
		}
		const who = document.createElement('span');
		who.className = 'pkg';
		who.textContent = pkg;
		row.append(who);
		const marks = document.createElement('span');
		marks.className = 'flags';
		for(const flag of flags) {
			if(FlagNames[flag]) {
				const one = document.createElement('span');
				one.className = 'flag';
				one.textContent = FlagNames[flag];
				marks.append(one);
			}
		}
		const ver = document.createElement('span');
		ver.className = 'ver';
		ver.textContent = Number(downloads) > 0 ? version + ' · ' + count(downloads) : version;
		ver.title = Number(downloads) > 0
		? Number(downloads).toLocaleString('en-US') + ' CRAN downloads in the last month'
		: 'ships with R, so CRAN counts nothing';
		const tag = document.createElement('span');
		tag.className = 'tag';
		tag.textContent = base === '1' ? 'base R' : 'CRAN';
		const go = document.createElement('span');
		go.className = 'go';
		go.textContent = '↗';
		row.append(marks, ver, tag, go);
		list.append(row);
	}
	const note = document.createElement('p');
	note.className = 'ask';
	note.textContent = ':query @signature ' + name;
	const said = document.createElement('span');
	said.textContent = 'for parameters and the call graph, ask flowR:';
	box.append(list, note);
	note.prepend(said);
	return box;
}

/** `print.rema` dispatches for `print`: the longest prefix before a dot that is itself a known name */
function genericOf(name, owners) {
	if(!owners.some(entry => owner(entry).flags.includes('3'))) {
		return undefined;
	}
	for(let at = name.indexOf('.'); at > 0; at = name.indexOf('.', at + 1)) {
		if(known.has(name.slice(0, at))) {
			return name.slice(0, at);
		}
	}
	return undefined;
}

/** a package is a thing to find too: searching `dplyr` should offer the package, not only its names */
function showPackage(index, needle, at) {
	const [name, version, base, downloads, exports, releases, since, archived] = packages[index];
	const row = document.createElement('li');
	row.className = 'pkghit';
	const head = document.createElement('div');
	head.className = 'head';
	const title = document.createElement('span');
	title.className = 'name';
	title.append(name.slice(0, at));
	const hit = document.createElement('mark');
	hit.textContent = name.slice(at, at + needle.length);
	title.append(hit, name.slice(at + needle.length));
	const badge = document.createElement('span');
	badge.className = 'kindtag';
	badge.textContent = base === '1' ? 'base R package' : archived === '1' ? 'archived package' : 'package';
	if(archived === '1') {
		badge.classList.add('gone');
	}
	const facts = document.createElement('span');
	facts.className = 'owners';
	facts.textContent = [
		version,
		Number(downloads) > 0 ? count(downloads) : null,
		exports + ' exports',
		Number(releases) > 0 ? releases + (Number(releases) === 1 ? ' release' : ' releases') : null
	].filter(Boolean).join(' · ');
	facts.title = Number(downloads) > 0
		? Number(downloads).toLocaleString('en-US') + ' CRAN downloads in the last month'
		: 'ships with R, so CRAN counts nothing';
	head.append(title, badge, facts);
	row.append(head);
	/* the button scopes the search; the row itself opens what flowR knows about the package */
	row.addEventListener('click', event => {
		if(event.target.closest('a')) {
			return;
		}
		const open = row.querySelector('.detail');
		open ? open.remove() : row.append(aboutPackage(index));
	});
	hits.append(row);
}

/** what the database holds about one package, in the same shape as the per-name detail */
function aboutPackage(index) {
	const [name, version, base, downloads, exports, releases, since, archived] = packages[index];
	const box = document.createElement('div');
	box.className = 'detail';
	const facts = [
		['latest version', version],
		['exported names', Number(exports).toLocaleString('en-US')],
		['releases known', Number(releases) > 0
			? Number(releases).toLocaleString('en-US') + (Number(since) > 0 ? ', the first in ' + since : '')
			: 'none recorded'],
		['downloads', Number(downloads) > 0 ? Number(downloads).toLocaleString('en-US') + ' in the last month' : 'ships with R'],
		['comes from', base === '1' ? 'base R' : archived === '1' ? 'CRAN, since archived' : 'CRAN']
	];
	for(const [label, value] of facts) {
		const line = document.createElement('p');
		const key = document.createElement('span');
		key.className = 'kind';
		key.textContent = label;
		line.append(key, value);
		box.append(line);
	}
	const links = document.createElement('p');
	links.className = 'links';
	const where = base === '1'
		? ['https://stat.ethz.ch/R-manual/R-devel/library/' + encodeURIComponent(name) + '/html/00Index.html', 'the R manual']
		: ['https://cran.r-project.org/package=' + encodeURIComponent(name), 'CRAN'];
	for(const [href, text] of [where, ['?q=' + encodeURIComponent(name + '::'), 'everything it exports']]) {
		const link = document.createElement('a');
		link.href = href;
		if(href.startsWith('http')) {
			link.target = '_blank';
			link.rel = 'noopener';
		} else {
			link.addEventListener('click', event => {
				event.preventDefault();
				clearFilters();
				q.value = name + '::';
				void search();
			});
		}
		link.textContent = text;
		links.append(link);
	}
	box.append(links);
	return box;
}

function show(name, needle, at, owners) {
	const row = document.createElement('li');
	const head = document.createElement('div');
	head.className = 'head';
	/* the package a reader most likely means decides: `pi` is a constant even though something exports a `pi()` */
	const value = owner(owners[0]).flags.includes('v');
	head.append(marked(name, needle, at));
	if(value) {
		head.firstChild.classList.add('value');
		const badge = document.createElement('span');
		badge.className = 'kindtag value';
		badge.textContent = 'value';
		head.append(badge);
	}
	for(const kind of kinds.get(name) ?? []) {
		const badge = document.createElement('span');
		badge.className = 'kindtag';
		badge.textContent = KindNames[kind] ?? kind;
		head.append(badge);
	}
	const generic = genericOf(name, owners);
	if(generic) {
		const link = document.createElement('a');
		link.className = 'generic';
		link.href = '?q=' + encodeURIComponent(generic);
		link.textContent = 'S3 method for ' + generic;
		link.title = 'search for the generic this method dispatches for';
		head.append(link);
	}
	const list = document.createElement('span');
	list.className = 'owners';
	for(const entry of owners.slice(0, Shown)) {
		list.append(ownerLink(owner(entry).index));
	}
	if(owners.length > Shown) {
		const rest = document.createElement('button');
		rest.type = 'button';
		rest.className = 'more';
		rest.textContent = '+' + (owners.length - Shown) + ' more';
		list.append(rest);
	}
	head.append(list);
	row.append(head);
	row.addEventListener('click', event => {
		if(event.target.closest('a')) {
			return;   // a link is a link, not a toggle
		}
		const open = row.querySelector('.detail');
		if(open) {
			open.remove();
		} else {
			row.append(detail(name, owners));
		}
	});
	hits.append(row);
}

let pending = 0;
async function search() {
	/* `dplyr::filter` asks about that package, not about every `filter` there is */
	const typed = q.value.trim().replace(/^\?/, '').replace(/\(\s*\)$/, '').trim();
	const qualified = /^([\w.]+):::?(.*)$/.exec(typed);
	const inPackage = qualified?.[1];
	const needle = (qualified?.[2] ?? typed).trim();
	const run = ++pending;
	hits.replaceChildren();

	if(names === null) {
		await ready;   // set up at the bottom of this script, so the first listing waits for it
		if(run !== pending) {
			return;   // the reader typed on while it was being read
		}
	}
	const lower = needle.toLowerCase();
	const matches = [];
	for(const line of names) {
		const tab = line.indexOf('\t');
		const name = line.slice(0, tab);
		const at = needle.length === 0 ? 0 : name.toLowerCase().indexOf(lower);
		const hit = needle.length === 0 || (mode.value === 'prefix' ? at === 0 : at >= 0);
		const owners = line.slice(tab + 1);
		if(hit) {
			/* `print` should beat `PRINT`: a match that also matches in case ranks ahead of one that does not */
			const cased = name.slice(at, at + needle.length) === needle ? 0 : 1;
			matches.push([name, at, owners, (at === 0 ? 0 : 2) + cased]);
		} else if(mode.value === 'fuzzy' && fuzzy(name.toLowerCase(), lower)) {
			/* `flter` should find `filter` before `Filter`: a fuzzy hit that also matches in case ranks first */
			matches.push([name, -1, owners, fuzzy(name, needle) ? 4 : 5]);
		}
	}
	if(sort.value === 'auto') {
		/* scoring parses an owner entry per hit, so a query matching six figures of names is first cut
		   down by the cheap key and only its head is scored properly */
		/* the cut has to know about the badge too, or `ggplot` never survives long enough to be scored:
		   `kinds` is a Map lookup, so this stays cheap */
		const key = (name, rank) => (kinds.has(name) ? 0 : 1000) + rank;
		matches.sort(([a, , , ra], [b, , , rb]) => key(a, ra) - key(b, rb) || a.length - b.length);
		const scored = matches.slice(0, 2000);
		for(const match of scored) {
			match[4] = score(match[0], match[2], match[3], needle);
		}
		scored.sort((a, b) => b[4] - a[4]);
		matches.splice(0, scored.length, ...scored);
	} else {
		matches.sort(([a, , , ra], [b, , , rb]) => ra - rb || a.length - b.length
			|| (a.toLowerCase() < b.toLowerCase() ? -1 : a.toLowerCase() > b.toLowerCase() ? 1 : a < b ? -1 : 1));
	}
	/* a package was named, so only the names it exports count */
	/* the package reads as a filter of its own, and can be taken off again */
	scope.hidden = inPackage === undefined;
	scope.textContent = inPackage === undefined ? '' : inPackage + ' ×';
	scope.title = 'only names exported by ' + inPackage;
	const wanted = inPackage === undefined ? undefined : byName.get(inPackage);
	const inScope = wanted === undefined ? matches
		: matches.filter(([, , owners]) => owners.split(',').some(entry => owner(entry).index === wanted));
	/* the packages whose own name matches; `packages` asks for those alone */
	const onlyPackages = active.has('only:package') || (needle.length === 0 && active.size === 0 && inPackage === undefined);
	const allPackages = inPackage !== undefined || (active.size > 0 && !onlyPackages) ? [] : packages
		.map(([name], index) => [name, index, name.toLowerCase().indexOf(lower)])
		/* only the package that was typed outright: three near-misses would bury the function `plot`
		   under `plotly` and `plotrix`. Browsing by name is what the `package` filter is for. */
		.filter(([name, , at]) => onlyPackages ? at >= 0 : name.toLowerCase() === lower)
		.sort(sort.value === 'auto'
			? ([, a], [, b]) => Number(packages[b][3]) - Number(packages[a][3])
			: ([a], [b]) => a.length - b.length || (a < b ? -1 : 1));
	const asPackage = allPackages.slice(0, onlyPackages ? limit : 3);
	for(const [, index, at] of asPackage) {
		showPackage(index, needle, at);
	}
	offerFilters(inScope);
	const kept = onlyPackages ? [] : inScope.filter(([name, , owners]) => passes(name, owners.split(',')));
	const found = kept.length;
	for(const [name, at, owners] of kept.slice(0, limit)) {
		show(name, needle, at, owners.split(','));
	}
	const where = inPackage === undefined ? ''
		: wanted === undefined ? ` (flowR knows no package called ${inPackage})` : ` in ${inPackage}`;
	report(onlyPackages ? allPackages.length : found, onlyPackages ? 'package' : 'name', where);
}

/** how many there are, how many are on screen, and a way to see more of them */
function report(total, what, where) {
	const shown = hits.children.length;
	if(total === 0) {
		status.textContent = `No ${what} matches that${where}.`;
		return;
	}
	status.textContent = `${total.toLocaleString('en-US')} ${what}${total === 1 ? '' : 's'}${where}`
		+ (shown < total ? ` · showing ${shown.toLocaleString('en-US')}` : '');
	if(shown < total) {
		const more = document.createElement('button');
		more.type = 'button';
		more.className = 'more-hits';
		more.textContent = `show ${Math.min(Step, total - shown)} more`;
		more.addEventListener('click', () => {
			limit += Step;
			void search();
		});
		hits.append(more);
	}
}

let timer = 0;
q.addEventListener('input', () => {
	clearTimeout(timer);
	limit = Step;   // a new question starts from the top again
	timer = setTimeout(search, 120);
});
mode.addEventListener('change', search);
sort.addEventListener('change', search);

q.value = new URLSearchParams(location.search).get('q') ?? '';
/* the table is read once, in the background, and the first listing follows on its own */
status.textContent = 'Reading the index…';
const ready = unpack().then(() => search(), () => {
	status.textContent = 'The index could not be read in this browser.';
});
q.addEventListener('change', () => history.replaceState(null, '', q.value ? '?q=' + encodeURIComponent(q.value) : location.pathname));
</script>
</body>
</html>
