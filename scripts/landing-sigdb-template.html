<!DOCTYPE html>
<html lang="en">

<meta charset="utf-8">

<title>flowR &middot; signature database</title>
<meta name="description" content="Search the R functions flowR knows: <!--FUNCTIONS--> exported names from <!--PACKAGES--> base-R and CRAN packages, the database behind its sophisticated call resolution.">
<link rel="icon" href="../img/flowR-mark-red.svg" type="image/svg+xml">
<script>
	/* the stored theme has to sit on the element before the first paint, or the page flashes the other one */
	try {
		const theme = localStorage.getItem('flowr-theme');
		if(theme) { document.documentElement.dataset.theme = theme; }
	} catch(e) { /* private mode keeps the system theme */ }
	/* every flowR page reads the same key, so a change on one of them follows you to the others */
	addEventListener('storage', e => {
		if(e.key === 'flowr-theme') {
			if(e.newValue) {
				document.documentElement.dataset.theme = e.newValue;
			} else {
				delete document.documentElement.dataset.theme;
			}
		}
	});
</script>
<style>
:root {
	--bg: #fbfbfc; --panel: #fff; --sunk: #f1f3f6; --fg: #1b1d21; --muted: #5c6270;
	--border: #d6dae1; --accent: #a63446; --accent-fg: #fff;
	--shadow: 0 1px 2px rgba(16,20,30,.06), 0 6px 18px rgba(16,20,30,.06);
	color-scheme: light;
}
:root[data-theme="dark"] {
	--bg: #14161a; --panel: #1b1e24; --sunk: #22262d; --fg: #e7e9ed; --muted: #a3aab8;
	--border: #2f343d; --accent: #56b4e9; --accent-fg: #10131a;
	--shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35); color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
	:root:not([data-theme="light"]) {
		--bg: #14161a; --panel: #1b1e24; --sunk: #22262d; --fg: #e7e9ed; --muted: #a3aab8;
		--border: #2f343d; --accent: #56b4e9; --accent-fg: #10131a;
		--shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35); color-scheme: dark;
	}
}
* { box-sizing: border-box; }
body {
	margin: 0; padding: 0 1rem 3rem; color: var(--fg); -webkit-text-size-adjust: 100%;
	font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

}

a { color: var(--accent); }

	display: flex; gap: .5rem 1rem; align-items: center; justify-content: space-between;

}

.bar .where::before { content: "/"; margin: 0 .5rem; opacity: .55; }

.bar nav a { white-space: nowrap; padding: .3rem .5rem; border-radius: .4rem; color: var(--muted); text-decoration: none; font-size: .82rem; }

<h1>Signature Database</h1>
<p class="lead">
	Search through all R functions flowR knows, using its
	<a href="https://github.com/flowr-analysis/flowr/wiki/Signature-Database" target="_blank" rel="noopener">signature database</a>
	<span class="when">(last updated <!--UPDATED-->, only most recent package versions)</span>.
</p>

<script type="text/plain" id="data"><!--DATA--></script>

<script>
/* the ranker the playground shares, written in from `src/util/text/name-rank.ts` by the build */
<!--RANKER-->
'use strict';
const theme = document.getElementById('theme');
theme.addEventListener('click', () => {
	const dark = matchMedia('(prefers-color-scheme: dark)').matches;
	const next = (document.documentElement.dataset.theme || (dark ? 'dark' : 'light')) === 'dark' ? 'light' : 'dark';
	document.documentElement.dataset.theme = next;
	try { localStorage.setItem('flowr-theme', next); } catch(e) { /* private mode forgets the choice */ }
});

/* The table is unpacked once, on the first search, so opening the page stays cheap. */
let packages = null, names = null, known, byName = null;
async function unpack() {
	const encoded = document.getElementById('data').textContent.trim();
	/* the decode is the slow part, so it happens in a worker built from a blob: no extra file to ship */
	const text = await inWorker(encoded).catch(() => decode(encoded));
	/* split at the first blank line only: a stray one further in must not cut the package table short */
	const between = text.indexOf('\n\n');
	const nameBlob = text.slice(0, between), packageBlob = text.slice(between + 2);
	/* the name table stays one string: splitting it into 577k entries is what used to freeze the page */
	names = nameBlob;
	packages = packageBlob.split('\n').map(line => line.split('\t'));
	/* a package name back to its row, so `dplyr::` can be answered without scanning the table */
	byName = new Map(packages.map(([name], index) => [name, index]));
}

const q = document.getElementById('q'), mode = document.getElementById('mode');
const sort = document.getElementById('sort');
const Filters = [
	['only', 'package', 'package'], ['pkg', 'archived', 'archived'],
	['flag', 't', 'throws'], ['flag', 'n', 'non-deterministic'], ['flag', '3', 'S3 method'],
	['flag', 'x', 'deprecated'], ['flag', 'd', 'calls deprecated'], ['flag', 'v', 'value'],
	['kind', 'read', 'reads'], ['kind', 'write', 'writes'],
	['kind', 'visualize', 'plots'], ['kind', 'library', 'loads']
];
const active = new Set();
const filters = document.getElementById('filters');
const scope = document.getElementById('scope');
scope.addEventListener('click', () => {
	q.value = q.value.replace(/^[\w.]+:::?/, '');
	void search();
});
const picks = [...document.querySelectorAll('.pick')];
let how = 'all';
const buttons = new Map();
for(const [what, key, label] of Filters) {
	const button = document.createElement('button');
	button.type = 'button';
	button.textContent = label;
	button.setAttribute('aria-pressed', 'false');
	button.addEventListener('click', () => {
		const id = what + ':' + key;
		active.has(id) ? active.delete(id) : active.add(id);
		button.setAttribute('aria-pressed', String(active.has(id)));
		void search();
	});
	buttons.set(what + ':' + key, button);
	filters.append(button);
}
for(const pick of picks) {
	pick.addEventListener('click', () => {
		how = pick.dataset.mix;
		picks.forEach(other => other.setAttribute('aria-pressed', String(other === pick)));
		void search();
	});
}

/** drops every active filter, which is what asking for a whole package means */
function clearFilters() {
	active.clear();
	for(const button of buttons.values()) {
		button.setAttribute('aria-pressed', 'false');
	}
}

/** does one filter hold for this name? */
function holds(id, name, owners) {
	const [what, key] = id.split(':');
	if(what === 'only') {
		return false;   // it selects what is listed, not which names qualify
	}
	if(what === 'pkg') {
		/* a property of the package rather than of the name: archived means CRAN dropped it */
		return owners.some(entry => packages[owner(entry).index]?.[7] === '1');
	}
	return what === 'kind'
		? (kinds.get(name) ?? []).includes(key)
		: owners.some(entry => owner(entry).flags.includes(key));
}

/** `all of` wants every active filter, `any of` wants one of them */
function passes(name, owners) {
	if(active.size === 0) {
		return true;
	}
	const matched = [...active].filter(id => holds(id, name, owners)).length;
	return how === 'any' ? matched > 0 : how === 'none' ? matched === 0 : matched === active.size;
}

/** a filter that would leave nothing behind is greyed out rather than silently emptying the list */
function offerFilters(matches) {
	for(const [id, button] of buttons) {
		/* `match none` is about what to exclude, so a filter that matches nothing is still useful there */

/** base64 to gzip to text, the plain way */
async function decode(encoded) {
	const raw = Uint8Array.from(atob(encoded), c => c.charCodeAt(0));
	return new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
}

/** the same, on a worker thread, so the page stays usable while several megabytes are unpacked */
function inWorker(encoded) {
	const source = `self.onmessage = async ({ data }) => {
		const raw = Uint8Array.from(atob(data), c => c.charCodeAt(0));
		const text = await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
		self.postMessage(text);
	};`;
	return new Promise((resolve, reject) => {
		const url = URL.createObjectURL(new Blob([source], { type: 'text/javascript' }));
		const worker = new Worker(url);
		worker.onmessage = event => {
			resolve(event.data);
			worker.terminate();
			URL.revokeObjectURL(url);
		};
		worker.onerror = error => {
			reject(error);
			worker.terminate();
			URL.revokeObjectURL(url);
		};
		worker.postMessage(encoded);
	});
}

			const tab = names.indexOf('\t', at);

			const end = names.indexOf('\n', tab);

function marked(name, needle, at) {
	const span = document.createElement('span');
	span.className = 'name';

	if(at < 0) {
		/* a fuzzy hit matches scattered characters; neighbours join into one mark so `filter` reads as
		   one highlight rather than six boxes in a row */
		const wanted = needle.toLowerCase();
		let next = 0, run = '', plain = '';

			if(run) {

				one.textContent = run;

				run = '';

		for(const c of name) {

				span.append(plain);
				plain = '';

				next++;

/* how many names the scan walks before it lets the page breathe again, and how many hits are still
   worth counting the packages of */
const Chunk = 40000;
const Countable = 50000;

let pending = 0;
async function search() {
	/* `dplyr::filter` asks about that package, not about every `filter` there is */
	const typed = q.value.trim().replace(/^\?/, '').replace(/\(\s*\)$/, '').trim();
	const qualified = /^([\w.]+):::?(.*)$/.exec(typed);
	const inPackage = qualified?.[1];
	/* a search for `dplyr::filter` is about dplyr's, so that is the one a hit answers for */
	scoped = inPackage;
	const needle = (qualified?.[2] ?? typed).trim();
	const run = ++pending;
	hits.replaceChildren();

	if(names === null) {
		await ready;   // set up at the bottom of this script, so the first listing waits for it
		if(run !== pending) {
			return;   // the reader typed on while it was being read
		}
	}
	const lower = needle.toLowerCase();
	const matches = [];
	/* 577k names are more than one frame can hold, so the scan hands the thread back every so often
	   and gives up as soon as a newer keystroke has started its own */
	let breathe = Chunk;
	for(let start = 0; start < names.length;) {
		if(--breathe === 0) {
			breathe = Chunk;
			await new Promise(resume => setTimeout(resume, 0));
			if(run !== pending) {
				return;
			}
		}
		const tab = names.indexOf('\t', start);
		const stop = names.indexOf('\n', tab);
		const end = stop < 0 ? names.length : stop;
		const name = names.slice(start, tab);
		start = end + 1;
		const at = needle.length === 0 ? 0 : name.toLowerCase().indexOf(lower);
		const hit = needle.length === 0 || (mode.value === 'prefix' ? at === 0 : at >= 0);
		if(!hit && mode.value !== 'fuzzy') {
			continue;   // the owners are only sliced out for a name that survives
		}
		const owners = names.slice(tab + 1, end);
		if(hit) {
			/* `print` should beat `PRINT`: a match that also matches in case ranks ahead of one that does not */
			const cased = name.slice(at, at + needle.length) === needle ? 0 : 1;
			matches.push([name, at, owners, (at === 0 ? 0 : 2) + cased]);
		} else if(mode.value === 'fuzzy' && fuzzy(name.toLowerCase(), lower)) {
			/* `flter` should find `filter` before `Filter`: a fuzzy hit that also matches in case ranks first */
			matches.push([name, -1, owners, fuzzy(name, needle) ? 4 : 5]);
		}
	}
	if(sort.value === 'auto') {
		/* scoring parses an owner entry per hit, so a query matching six figures of names is first cut
		   down by the cheap key and only its head is scored properly */
		/* the cut has to know about the badge too, or `ggplot` never survives long enough to be scored:
		   `kinds` is a Map lookup, so this stays cheap */
		const key = (name, rank) => (kinds.has(name) ? 0 : 1000) + rank;
		/* comparison-sorting six figures of matches costs a visible pause, and the key only takes a
		   handful of values: counting them out keeps the good ones in front for a fraction of that */
		const buckets = new Map();
		for(const match of matches) {
			const at = key(match[0], match[3]);
			const bucket = buckets.get(at);
			if(bucket === undefined) {
				buckets.set(at, [match]);
			} else {
				bucket.push(match);
			}
		}
		let into = 0;
		for(const at of [...buckets.keys()].sort((a, b) => a - b)) {
			for(const match of buckets.get(at)) {
				matches[into++] = match;
			}
		}
		const scored = matches.slice(0, 2000);
		scored.sort(([a], [b]) => a.length - b.length);
		for(const match of scored) {
			match[4] = score(match[0], match[2], match[3], needle);
		}
		scored.sort((a, b) => b[4] - a[4]);
		matches.splice(0, scored.length, ...scored);
	} else {
		matches.sort(([a, , , ra], [b, , , rb]) => ra - rb || a.length - b.length
			|| (a.toLowerCase() < b.toLowerCase() ? -1 : a.toLowerCase() > b.toLowerCase() ? 1 : a < b ? -1 : 1));
	}
	/* a package was named, so only the names it exports count */
	scope.hidden = true;
	const wanted = inPackage === undefined ? undefined : byName.get(inPackage);
	const inScope = wanted === undefined ? matches
		: matches.filter(([, , owners]) => owners.split(',').some(entry => owner(entry).index === wanted));
	/* the packages whose own name matches; `packages` asks for those alone */
	const onlyPackages = active.has('only:package') || (needle.length === 0 && active.size === 0 && inPackage === undefined);
	const allPackages = inPackage !== undefined || (active.size > 0 && !onlyPackages) ? [] : packages
		.map(([name], index) => [name, index, name.toLowerCase().indexOf(lower)])
		/* only the package that was typed outright: three near-misses would bury the function `plot`
		   under `plotly` and `plotrix`. Browsing by name is what the `package` filter is for. */
		.filter(([name, , at]) => onlyPackages ? at >= 0 : name.toLowerCase() === lower)
		.sort(sort.value === 'auto'
			? ([, a], [, b]) => Number(packages[b][3]) - Number(packages[a][3])
			: ([a], [b]) => a.length - b.length || (a < b ? -1 : 1));
	const asPackage = allPackages.slice(0, onlyPackages ? limit : 3);
	for(const [, index, at] of asPackage) {
		showPackage(index, needle, at);
	}
	offerFilters(inScope);
	const kept = onlyPackages ? [] : inScope.filter(([name, , owners]) => passes(name, owners.split(',')));
	const found = kept.length;
	/* how many packages those names come from; a query that matches half the database is not worth
	   counting, and its answer would be `all of them` anyway */
	let inPackages;
	if(found > 0 && found <= Countable) {
		const seen = new Set();
		for(const [, , owners] of kept) {
			for(const entry of owners.split(',')) {
				const colon = entry.indexOf(':');
				seen.add(colon < 0 ? entry : entry.slice(0, colon));
			}
		}
		inPackages = seen.size;
	}
	for(const [name, at, owners] of kept.slice(0, limit)) {
		show(name, needle, at, withStatedOwner(name, owners.split(',')));
	}
	const where = inPackage === undefined ? ''
		: wanted === undefined ? ` (flowR knows no package called ${inPackage})` : ` in ${inPackage}`;
	report(onlyPackages ? allPackages.length : found, onlyPackages ? 'package' : 'name', where, inPackages);
}

/** how many there are, where they live, how many are on screen, and a way to see more of them */
function report(total, what, where, inPackages) {
	const shown = hits.children.length;
	if(total === 0) {
		status.textContent = `Nothing here goes by that name${where}.`;
		return;
	}
	/* `11 names in dplyr in 23 packages` reads as a mistake, so a scoped answer says `also in` */
	const count = inPackages === undefined ? undefined
		: `${inPackages.toLocaleString('en-US')} package${inPackages === 1 ? '' : 's'}`;
	const from = count === undefined ? '' : where.length > 0 ? ` (also in ${count})` : ` in ${count}`;
	status.textContent = `${total.toLocaleString('en-US')} ${what}${total === 1 ? '' : 's'}${where}${from}`
		+ (shown < total ? ` · showing ${shown.toLocaleString('en-US')}` : '');
	if(shown < total) {
		const more = document.createElement('button');
		more.type = 'button';
		more.className = 'more-hits';
		more.textContent = `show ${Math.min(Step, total - shown)} more`;
		more.addEventListener('click', () => {
			limit += Step;
			void search();
		});
		hits.append(more);
	}
}

let timer = 0;
q.addEventListener('input', () => {
	clearTimeout(timer);
	limit = Step;   // a new question starts from the top again
	timer = setTimeout(search, 120);
});
mode.addEventListener('change', search);
sort.addEventListener('change', search);

q.value = new URLSearchParams(location.search).get('q') ?? '';
/* the table is read once, in the background, and the first listing follows on its own */
status.textContent = 'Unpacking the database…';
const ready = unpack().then(() => search(), error => {
	status.textContent = `This browser could not unpack the database, sorry (${error}).`;
});
q.addEventListener('change', () => history.replaceState(null, '', q.value ? '?q=' + encodeURIComponent(q.value) : location.pathname));
</script>
<script>
	/* the tag says the number, the name that release carries only lives on GitHub, so it is fetched once someone asks for it */
	(function() {
		const tag = document.getElementById('version');
		if(!tag) { return; }
		let asked = false;
		const name = () => {
			if(asked || !tag.textContent) { return; }
			asked = true;
			fetch('https://api.github.com/repos/flowr-analysis/flowr/releases/tags/' + tag.textContent)
				.then(r => r.ok ? r.json() : Promise.reject(r.status))
				.then(release => {
				if(release.name) {
					const when = release.published_at
						? new Date(release.published_at).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' })
						: '';
					tag.title = when ? release.name + ', released ' + when : release.name;
				}
			})
				.catch(() => { /* the title it already carries says enough */ });
		};
		tag.addEventListener('pointerenter', name);
		tag.addEventListener('focus', name);
	})();
</script>
