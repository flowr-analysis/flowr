<script>
	/* set theme before first paint to avoid a flash of the other theme; a link may carry one */
	try {
		const asked = new URLSearchParams(location.hash.replace(/^#/, '')).get('theme');
		const theme = asked || localStorage.getItem('flowr-theme');
		if(theme === 'light' || theme === 'dark') { document.documentElement.dataset.theme = theme; }
	} catch(e) { /* private mode keeps the system theme */ }
	/* sync theme across tabs/pages sharing the same localStorage key */
	addEventListener('storage', e => {
		if(e.key === 'flowr-theme') {
			if(e.newValue) {
				document.documentElement.dataset.theme = e.newValue;
			} else {
				delete document.documentElement.dataset.theme;
			}
		}
	});
	/* what the theme was when the click started, so a page that switches it itself is left alone */
	let themeBefore = null;
	document.addEventListener('click', e => {
		if(e.target.closest?.('#theme')) { themeBefore = document.documentElement.dataset.theme; }
	}, true);
	/* delegate click since #theme isn't parsed yet; later listeners for theme-dependent redraws run after this */
	document.addEventListener('click', e => {
		if(!e.target.closest?.('#theme') || document.documentElement.dataset.theme !== themeBefore) {
			return;
		}
		const next = getComputedStyle(document.body).colorScheme === 'dark' ? 'light' : 'dark';
		document.documentElement.dataset.theme = next;
		try { localStorage.setItem('flowr-theme', next); } catch(e) { /* private mode forgets the choice */ }
	});
	/* stack the bar from what its row actually holds rather than a guessed width: unstack, then see whether the nav
	   overflows; the links are watched too, as a late font widens them without resizing the bar. Once stacked, a
	   title that still pushes the controls onto a row of their own drops the version instead */
	addEventListener('DOMContentLoaded', () => {
		for(const bar of document.querySelectorAll('.bar')) {
			const nav = bar.querySelector('nav');
			const title = bar.querySelector('h2');
			const controls = bar.querySelector('.controls');
			const fit = () => {
				bar.classList.remove('stacked', 'tight');
				bar.classList.toggle('stacked', nav.scrollWidth > nav.clientWidth);
				bar.classList.toggle('tight', controls.offsetTop >= title.offsetTop + title.offsetHeight);
			};
			fit();
			const watch = new ResizeObserver(fit);
			for(const box of [bar, ...nav.children]) {
				watch.observe(box);
			}
		}
	});
</script>
