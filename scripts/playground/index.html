<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flowR &middot; playground</title>
<meta name="description" content="Run flowR on your own R code, in your browser: what a script touches, what the linter says, and the part that computes one value.">
<link rel="icon" href="../img/flowR-mark-red.svg" type="image/svg+xml">
<!--CHROME-SCRIPT-->
<style>
<!--THEME-LIGHT
	--bg: #fbfbfc; --panel: #fff; --sunk: #f1f3f6; --fg: #1b1d21; --muted: #5c6270;
	--border: #d6dae1; --accent: #a63446; --accent-fg: #fff; --mark: #e0a300; --markline: #b07d00; --plot-filter: none; color-scheme: light;
-->
<!--THEME-DARK
	--bg: #0f1216; --panel: #161a20; --sunk: #1c2129; --fg: #e7e9ed; --muted: #98a1b0;
	--border: #262c35; --accent: #56b4e9; --accent-fg: #0f1216; --mark: #e69f00; --markline: #f0b429; --plot-filter: invert(.9) hue-rotate(180deg); color-scheme: dark;
-->
<!--THEME-CSS:own-->
* { box-sizing: border-box; }
:root { --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; interpolate-size: allow-keywords; }
/* every list here gives its rows a `display` of their own, and that beats what `hidden` states: said once
   for the page, so nothing has to remember it again */
[hidden] { display: none !important; }
body {
	margin: 0; height: 100vh; display: flex; flex-direction: column;
	color: var(--fg); background: var(--bg);
	font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
a {
	color: var(--accent); text-decoration: none;
	text-decoration-thickness: from-font; text-underline-offset: .16em;
	transition: color .12s, border-color .12s, opacity .12s;
}
a:hover { color: color-mix(in srgb, var(--accent) 82%, var(--fg)); text-decoration: underline; }
@media (prefers-reduced-motion: reduce) { a { transition: none; } }
code, pre { font-family: var(--mono); }

<!--BAR-CSS-->
/* the bar spans the whole window here, not a centred column, so it brings its own margin and backdrop */
.bar { flex: none; padding-inline: 1rem; background: var(--panel); }
/* the aside only takes the room the nav leaves over, and a window too narrow for two short lines of it drops it */
.bar .note { color: var(--muted); font-size: .8rem; line-height: 1.35; flex: 1 1 0; min-width: 0; max-width: 54rem; }
@media (max-width: 80rem) { .bar .note { display: none; } }

/* the tools and the run button move as one, so a narrow pane never splits them over two rows */
.actions { display: inline-flex; align-items: center; margin-left: auto; }
.tools { display: inline-flex; align-items: center; gap: .3rem; margin: 0 0 .3rem; }
.tools button {
	display: inline-flex; align-items: center; gap: .3rem; font: inherit; font-size: .74rem; padding: .1rem .55rem; cursor: pointer;
	border-radius: 1rem; border: 1px solid var(--border); background: var(--panel); color: var(--fg);
}
.tools svg, #runrclear svg { width: .8rem; height: .8rem; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
#more { display: none; }
@container pane (max-width: 52rem) {
	.tools > :not(#more) { display: none; }
	.tools #more { display: inline-flex; }
}
@container pane (max-width: 36rem) {
	/* the file tabs keep their names: what does not fit beside them moves to a row above, so the tabs stay on the line */
	.tabs { flex-wrap: wrap-reverse; padding-inline: .5rem; }
	.tabs .tab { padding-inline: .5rem; }
}
.tools button:hover { border-color: var(--accent); color: var(--accent); }
.tools .sharenote { color: var(--muted); font-size: .74rem; max-width: 14rem; overflow: hidden; text-overflow: ellipsis; }
.split { flex: 1; display: grid; grid-template-columns: minmax(0, var(--split, 1.15fr)) .35rem minmax(14rem, 1fr); min-height: 0; }
/* the bar between the panes, dragged to give one of them more room */
.divider { cursor: ew-resize; background: var(--border); touch-action: none; transition: background .15s; }
.divider:hover { background: var(--accent); }
/* dragged most of the way over, a pane folds away entirely; the bar stays, a little wider, to be clicked or dragged back */
@media not all and (max-width: 52rem) {
	.split[data-fold="code"] { grid-template-columns: 0 .8rem minmax(0, 1fr); }
	.split[data-fold="panel"] { grid-template-columns: minmax(0, 1fr) .8rem 0; }
	.split[data-fold="code"] > .pane, .split[data-fold="panel"] > .right { visibility: hidden; }
	.split[data-fold] > .divider { display: grid; place-items: center; cursor: pointer; color: var(--muted); font-size: 1.1rem; font-weight: 700; }
	.split[data-fold] > .divider:hover { color: var(--accent-fg); }
	.split[data-fold="code"] > .divider::before { content: "\203A"; }
	.split[data-fold="panel"] > .divider::before { content: "\2039"; }
}
.pane { min-height: 0; min-width: 0; display: flex; flex-direction: column; border-right: 1px solid var(--border); container: pane / inline-size; }
/* the code and the configuration flowR reads it with, one at a time */
.tabs { display: flex; align-items: center; gap: .2rem; flex: none; padding: .3rem 1rem 0; border-bottom: 1px solid var(--border); white-space: nowrap; }
.tablist { display: flex; align-items: flex-end; align-self: flex-end; gap: .2rem; min-width: 0; flex: 0 1 auto; margin-bottom: -1px; }
/* the file tabs give way before the bar overflows: they shrink to a short name, and what still does not fit is cut, never drawn over the tabs beside them */
#files { display: flex; min-width: 0; overflow: hidden; }
#files .tab { overflow: hidden; text-overflow: ellipsis; max-width: 16rem; flex: 0 1 auto; min-width: 4.5rem; }
#treetoggle { display: inline-flex; align-items: center; padding-inline: .45rem; color: var(--muted); }
#treetoggle:hover, #treetoggle[aria-expanded="true"] { color: var(--fg); }
#treetoggle svg { width: 1rem; height: 1rem; fill: none; stroke: currentColor; stroke-width: 1.3; stroke-linejoin: round; }
#treetoggle .pane { fill: currentColor; stroke: none; opacity: 0; transition: opacity .15s; }
#treetoggle[aria-expanded="true"] .pane { opacity: .55; }
.work { display: flex; flex: 1; min-height: 0; }
.work > .code { display: flex; flex-direction: column; flex: 1; min-width: 0; }
#tree { flex: none; width: var(--tree-width, 11rem); max-width: 50%; overflow: auto; display: flex; flex-direction: column; padding: .2rem 0 .4rem; background: var(--sunk); font-size: .8rem; }
#tree[hidden] + .treegrip { display: none; }
@keyframes tree-in { from { margin-left: calc(-1 * var(--tree-width, 11rem)); } }
@media (prefers-reduced-motion: no-preference) { #tree:not([hidden]) { animation: tree-in 10ms ease-out; } }
.treegrip { flex: none; width: 5px; margin-left: -3px; cursor: col-resize; border-right: 1px solid var(--border); touch-action: none; position: relative; z-index: 1; }
.treegrip:hover { background: color-mix(in srgb, var(--accent) 35%, transparent); }
#tree .treehead { display: flex; align-items: center; justify-content: space-between; padding: .15rem .3rem .2rem .7rem; font-size: .72rem; color: var(--muted); }
#tree .treehead.examples { margin-top: .6rem; padding-top: .45rem; border-top: 1px solid var(--border); }
#tree .add svg { display: block; width: .9rem; height: .9rem; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; }
#tree .add { font: inherit; font-size: .95rem; line-height: 1; padding: .2rem .3rem; border: 0; border-radius: .25rem; background: none; color: var(--muted); cursor: pointer; }
#tree .add:hover, #tree .add[aria-expanded="true"] { color: var(--accent); background: color-mix(in srgb, var(--fg) 6%, transparent); }
#tree :is(.file, .folder) { display: flex; align-items: center; gap: .2rem; padding-block: .18rem; padding-right: .3rem; color: var(--fg); cursor: pointer; box-shadow: inset 2px 0 0 transparent; }
#tree .tname { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#tree .folder { color: var(--muted); }
#tree .folder .tname::before { content: "\25BE"; display: inline-block; width: 1em; font-size: .7rem; }
#tree .folder.folded .tname::before { content: "\25B8"; }
#tree .droptarget { background: color-mix(in srgb, var(--accent) 12%, transparent); outline: 1px dashed var(--accent); outline-offset: -1px; }
#tree :is(.file, .folder):hover { background: color-mix(in srgb, var(--fg) 5%, transparent); }
#tree .file[aria-current] { background: color-mix(in srgb, var(--accent) 10%, transparent); box-shadow: inset 2px 0 0 var(--accent); }
#tree .tact { visibility: hidden; flex: none; font: inherit; line-height: 1; padding: .05rem .25rem; border: 0; border-radius: .2rem; background: none; color: var(--muted); cursor: pointer; }
#tree :is(.file, .folder):is(:hover, :focus-within) .tact { visibility: visible; }
#tree .tact:hover { color: var(--accent); background: color-mix(in srgb, var(--fg) 8%, transparent); }
#tree .settings { margin-top: .4rem; padding-top: .35rem; border-top: 1px dashed var(--border); color: var(--muted); }
#tree .example { color: var(--muted); }
.tabs .tab {
	font: inherit; font-size: .8rem; padding: .3rem .7rem; cursor: pointer; color: var(--muted); flex: none;
	border: 1px solid transparent; border-bottom: 0; border-radius: .4rem .4rem 0 0; background: none;
}
.tabs .tab .pen { margin-left: .35rem; padding: 0 .15rem; border-radius: .2rem; color: var(--muted); visibility: hidden; }
.tabs .tab:hover .pen { visibility: visible; }
.tabs .tab .pen:hover { color: var(--accent); background: var(--sunk); }
.tabs .tab .x { margin-left: .45rem; padding: 0 .15rem; border-radius: .2rem; color: var(--muted); }
.tabs .tab .x:hover { color: #d55e00; background: var(--sunk); }
.tabs > :not(.tablist) { flex: none; }
/* below what opened it, kept on screen: the script sets where that is */
.menu {
	position: fixed; z-index: 20; display: flex; flex-direction: column; padding: .25rem; min-width: 11rem;
	top: var(--top); left: max(.5rem, var(--left)); margin-top: .15rem; max-height: calc(100dvh - var(--top) - 1rem); overflow-y: auto;
	background: var(--panel); border: 1px solid var(--border); border-radius: .4rem; box-shadow: 0 .4rem 1.2rem rgb(0 0 0 / .25);
}
.menu .heading { padding: .4rem .6rem .15rem; font-size: .7rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.menu hr { width: 100%; margin: .25rem 0; border: 0; border-top: 1px solid var(--border); }
.menu button {
	font: inherit; font-size: .8rem; text-align: left; padding: .3rem .6rem; cursor: pointer;
	border: 0; border-radius: .3rem; background: none; color: var(--fg);
}
.menu button:hover, .menu button:focus-visible { background: var(--sunk); color: var(--accent); outline: none; }
.tabs .tab:hover { color: var(--fg); }
.tabs .tab[aria-selected="true"] { color: var(--fg); background: var(--panel); border-color: var(--border); }
/* above the configuration: whether flowR uses it, and what keeps it from doing so */
#configbar { flex: none; border-bottom: 1px solid var(--border); background: var(--panel); font-size: .76rem; }
#configbar .state { display: flex; flex-wrap: wrap; align-items: center; gap: .3rem .8rem; padding: .35rem 1rem; }
#confignote { color: var(--muted); }
#confignote.bad { color: #d55e00; font-weight: 600; }
#configreset {
	margin-left: auto; font: inherit; cursor: pointer; padding: .05rem .6rem;
	border-radius: 1rem; border: 1px solid var(--border); background: var(--panel); color: var(--fg);
}
#configreset:hover { color: var(--accent); border-color: var(--accent); }
#configproblems { display: flex; flex-direction: column; max-height: 7.5rem; overflow: auto; padding: 0 1rem .4rem; }
#configproblems button {
	display: flex; align-items: baseline; gap: .6rem; padding: .2rem .5rem; text-align: left; cursor: pointer;
	font: inherit; font-family: var(--mono); color: var(--fg);
	border: 0; border-left: 3px solid #d55e00; border-radius: 0 .3rem .3rem 0; background: color-mix(in srgb, #d55e00 9%, var(--panel));
}
#configproblems button + button { margin-top: .2rem; }
#configproblems button:hover { background: color-mix(in srgb, #d55e00 16%, var(--panel)); }
#configproblems .where { flex: none; color: var(--muted); font-family: system-ui, sans-serif; }
#editor, #config { min-height: 0; flex: 1; overflow: auto; }
#editor { display: flex; flex-direction: column; }
#editor .cm-editor { flex: 1; min-height: 0; }
.pane.dropping { outline: 2px dashed var(--accent); outline-offset: -2px; }
/* flowR's own repl, folded away under the panes until someone opens it */
.drawer { flex: none; border-top: 1px solid var(--border); background: var(--panel); }
.drawer > summary {
	cursor: pointer; padding: .4rem 1rem; font-size: .82rem; font-weight: 600; list-style: none;
	display: flex; align-items: baseline; gap: .6rem;
}
.drawer > summary::-webkit-details-marker { display: none; }
.drawer > summary::before { content: "▸"; color: var(--muted); font-weight: 400; flex: none; }
.drawer[open] > summary::before { content: "▾"; }
.drawer > summary:hover { color: var(--accent); }
.drawer > summary .label { flex: none; white-space: nowrap; }
.drawer > summary .what {
	color: var(--muted); font-weight: 400; font-size: .78rem;
	min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.drawer > summary .what code { font-size: .95em; }
.drawer .body { display: flex; flex-direction: column; height: var(--repl-height, 14rem); border-top: 1px solid var(--border); }
/* the bars one drags to give the repl or the R output more or less room */
.grip { flex: none; height: .4rem; cursor: ns-resize; touch-action: none; background: var(--sunk); }
.grip:hover { background: color-mix(in srgb, var(--accent) 35%, var(--sunk)); }
#repl .out {
	flex: 1; min-height: 0; overflow: auto; margin: 0; padding: .6rem .8rem; white-space: pre-wrap;
	font-family: var(--mono); font-size: .8rem;
}
#repl .said { color: var(--accent); }
#repl .out a { color: var(--accent); }
:is(#repl, #runr .out) .bad { color: #d55e00; }
:is(#repl, #runr .out) .note { color: var(--muted); }
:is(#repl, #runr) .out canvas { display: block; max-width: 100%; height: auto; margin: .4rem 0; border-radius: .3rem; filter: var(--plot-filter, none); }
.figures { margin: .4rem 0; }
.figure-tabs { display: flex; flex-wrap: wrap; gap: .25rem; margin: .25rem 0; }
.figure-tab { padding: .1rem .5rem; border: 1px solid var(--border); border-radius: .3rem; background: none; color: var(--muted); font: inherit; font-size: .75rem; cursor: pointer; }
.figure-tab.on { border-color: var(--accent); color: var(--fg); }
.figure-view img { display: block; max-width: 100%; height: auto; border-radius: .3rem; background: #fff; }
.figure-view { container-type: inline-size; }
.figure-view object { display: block; width: 100%; max-height: 70vh; border: 0; border-radius: .3rem; }
#runr:not(.shiny) .via .shinylive, #runr.shiny .via .webr, #runr.shiny #runrtrust { display: none; }
#repl .ask { position: relative; display: flex; align-items: center; gap: .4rem; padding: .4rem .8rem; border-top: 1px solid var(--border); }
#repl .ask > span { color: var(--accent); font-family: var(--mono); }
#repl input {
	flex: 1; font: inherit; font-size: .82rem; padding: .2rem .4rem; color: var(--fg);
	font-family: var(--mono);
	border: 1px solid var(--border); border-radius: .3rem; background: var(--bg);
}
#repl input:focus { outline: none; border-color: var(--accent); }
/* what the line can go on with, above it, the way the editor offers names: flowR's own completer decides */
#replhints {
	position: absolute; left: 2.4rem; right: .8rem; bottom: calc(100% - .2rem); z-index: 5; margin: 0; padding: .25rem; list-style: none;
	max-height: min(14rem, 60vh); overflow-y: auto; border: 1px solid var(--border); border-radius: .4rem;
	background: var(--panel); box-shadow: 0 .4rem 1.2rem rgb(0 0 0 / .2);
	font-family: var(--mono); font-size: .8rem;
}
#replhints li { display: flex; align-items: baseline; gap: .8rem; padding: .15rem .5rem; border-radius: .25rem; cursor: pointer; white-space: nowrap; }
#replhints li b { font-weight: 600; color: var(--fg); }
#replhints li span { min-width: 0; overflow: hidden; text-overflow: ellipsis; color: var(--muted); font-family: system-ui, sans-serif; font-size: .92em; }
#replhints li:hover, #replhints li[aria-selected="true"] { background: color-mix(in srgb, var(--accent) 14%, transparent); }
#replhints li[aria-selected="true"] b { color: var(--accent); }
#replhints .hintdocs { margin-left: auto; padding-left: .6rem; font-size: .74rem; color: var(--accent); }
/* running the script is the one primary action of the editor, so it gets the one filled button */
.runbtn {
	display: inline-flex; align-items: center; gap: .4rem; margin: 0 0 .3rem .5rem; padding: .18rem .85rem;
	font: inherit; font-size: .78rem; font-weight: 600; cursor: pointer; white-space: nowrap;
	border: 0; border-radius: 1rem; color: var(--accent-fg); background: var(--accent);
}
.runbtn:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 88%, var(--fg)); }
.runbtn:disabled { opacity: .6; cursor: progress; }
.runbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* the run button and the choice of whether a run starts R fresh, as one */
.runsplit { display: inline-flex; flex: none; margin: 0 0 .3rem .5rem; }
.runsplit .runbtn { margin: 0; }
#runrgo { border-radius: 1rem 0 0 1rem; }
#runmode { padding: .18rem .5rem .18rem .4rem; border-radius: 0 1rem 1rem 0; border-left: 1px solid color-mix(in srgb, var(--accent-fg) 30%, var(--accent)); }
/* a chevron drawn rather than typed, so it sits on the same baseline in every font */
#runmode::before {
	content: ""; width: .5rem; height: .5rem; background: currentColor;
	clip-path: polygon(10% 30%, 50% 72%, 90% 30%, 100% 42%, 50% 92%, 0% 42%);
}
/* the run icon, on this button and on every notebook cell: a play triangle and, for a run that keeps the
   R session, a turning arrow; the ring around that is the button's own colour, cutting it out of the triangle */
.runicon { width: .8rem; height: .8rem; flex: none; overflow: visible; fill: currentColor; }
#runrgo:not(.same) .badge { display: none; }
.runicon .badge circle { fill: var(--accent); }
.runicon .badge path { fill: none; stroke: currentColor; stroke-width: 1.2; stroke-linecap: round; }
.runicon .badge .tip { fill: currentColor; stroke: none; }
.runicon .badge, .runicon .turn { transform-origin: 8px 8px; }
.menu button[aria-checked]::before { content: "\2713"; display: inline-block; width: 1.2em; visibility: hidden; }
.menu button[aria-checked="true"]::before { visibility: visible; }
/* what R said, above flowR's view of the same script */
#runr {
	/* until dragged, as tall as what R said, up to under half the pane */
	flex: none; display: flex; flex-direction: column; height: var(--runr-height, auto); max-height: var(--runr-height, 45%);
	background: var(--panel); border-bottom: 1px solid var(--border);
}
#runr .head {
	display: flex; align-items: center; gap: .5rem; padding: .5rem 1.2rem .3rem; white-space: nowrap;
	font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
}
#runrstate, #runrbytes, #runr .via { font-weight: 400; letter-spacing: .02em; text-transform: none; }
/* one line however narrow the card: the words give way, the bar keeps its width */
#runrstate, #runr .via { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.runr-bytes { font-variant-numeric: tabular-nums; }
.runr-progress { flex: none; width: 5rem; height: .4rem; accent-color: var(--accent); }
/* a cell and the repl wait with the same bar, as the card is closed while they run */
.runr-meter { display: flex; align-items: center; gap: .5rem; }
#runr .via a { color: inherit; text-decoration: underline dotted; }
#runr .via a:hover { color: var(--accent); }
#runrtrust { cursor: help; }
#runrtrust.ok { color: #009e73; }
#runrtrust.ok::before { content: "\2713\00a0"; }
#runrtrust.bad { color: #d55e00; }
#runrtrust.bad::before { content: "\2717\00a0"; }
#runr.busy #runrstate::before {
	content: ""; display: inline-block; width: .55rem; height: .55rem; margin-right: .4rem; vertical-align: -.05rem;
	border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { #runr.busy #runrstate::before { animation: none; } }
#runr .head button {
	font: inherit; font-size: .72rem; text-transform: none; letter-spacing: 0; cursor: pointer; padding: .05rem .55rem;
	border-radius: 1rem; border: 1px solid var(--border); background: var(--panel); color: var(--muted);
}
#runr .head button:hover { color: var(--accent); border-color: var(--accent); }
/* the buttons sit at the end of the head, from whichever of them is shown first */
#runr .head button:not([hidden]) { margin-left: auto; }
#runr .head button:not([hidden]) ~ button { margin-left: 0; }
#runrclear { display: inline-flex; align-items: center; gap: .25rem; }
#runr .out {
	flex: 1; min-height: 0; overflow: auto; padding: 0 1.2rem .8rem; white-space: pre-wrap; overflow-wrap: anywhere;
	font-family: var(--mono); font-size: .8rem;
}
#runr .grip { border-top: 1px solid var(--border); }
/* a call by name, which the R mode leaves plain: weight rather than colour */
.cm-call { color: var(--fg); font-weight: 600; }
/* what the linter marks, and what flowR can say about a name */
.cm-pinned { outline: 1.5px solid var(--accent); outline-offset: 1px; border-radius: 3px; }
.cm-jumpable { text-decoration: underline; text-underline-offset: .2em; cursor: pointer; }
.cm-lint { --hue: #d55e00; text-decoration: underline wavy var(--hue); text-underline-offset: .22em; }
/* what the current slice leaves out, still readable but clearly not part of the answer */
.cm-outside { opacity: .4; }
/* the lines the panel row under the pointer stands for */
.cm-linked { background: color-mix(in srgb, var(--accent) 20%, transparent); }
/* what a link points at, kept apart from every other mark because it is the reason the link was sent */
.cm-shown {
	/* the word and no more, on every side: what stands next to it, and what stands under it on the next
	   line, belongs to the code rather than to the mark */
	border-radius: .22rem; padding: .01em 0; margin: 0;
	background: color-mix(in srgb, var(--mark) 20%, transparent);
	box-shadow: 0 0 0 1px color-mix(in srgb, var(--markline) 50%, transparent),

#panel .rule .followup { opacity: .7; font-weight: 400; margin-left: .4rem; }
#panel .lintmore .about { margin: 0; color: var(--muted); }
#panel .lintmore .diff { margin: .4rem 0; padding: .3rem .5rem; border-radius: .3rem; background: var(--panel); font-size: .76rem; overflow-x: auto; white-space: pre; }
#panel .lintmore .del { color: #b42318; background: color-mix(in srgb, #b42318 9%, transparent); }
#panel .lintmore .ins { color: #0f766e; background: color-mix(in srgb, #0f766e 9%, transparent); }
#panel .lintmore .more { color: var(--muted); }
#panel .lints .lint {
	display: grid; grid-column: 1 / -1; grid-template-columns: subgrid; align-items: baseline;
	padding: .4rem .6rem; border-radius: .4rem; cursor: pointer;
	border: 1px solid color-mix(in srgb, var(--hue) 18%, var(--border)); border-left: 3px solid color-mix(in srgb, var(--hue) 75%, transparent);
	background: color-mix(in srgb, var(--hue) 4%, var(--panel));
	transition: background-color .12s, border-color .12s;
}
#panel .lints .lint:hover { background: color-mix(in srgb, var(--hue) 10%, var(--panel)); border-color: color-mix(in srgb, var(--hue) 40%, var(--border)); }
#panel .lints .lint .says { line-height: 1.4; }
#panel .lints .lint.member { margin-left: 1rem; }
#panel .lints .lint.member[hidden] { display: none; }
#panel .lints .lintgroup .says { color: var(--muted); }
#panel .lints .lintgroup .toggle { justify-self: end; font-size: .72rem; color: var(--muted); }
#panel .lints .lintgroup .toggle::after {
	content: ''; display: inline-block; width: .35rem; height: .35rem; margin-left: .35rem;
	border: solid currentColor; border-width: 0 1.5px 1.5px 0; transform: translateY(-.15rem) rotate(45deg); transition: transform .12s;
}
#panel .lints .lintgroup.open .toggle::after { transform: translateY(.05rem) rotate(-135deg); }
#panel .lints .lint .at {
	justify-self: end; padding: 0 .4rem; border-radius: 1rem; font-size: .72rem;
	background: var(--sunk); border: 1px solid var(--border);
}

#panel .says { font-size: .84rem; }
#panel .facts { display: grid; grid-template-columns: auto 1fr; gap: .2rem .9rem; font-size: .84rem; }
#panel .facts .fname { color: var(--muted); font-size: .74rem; text-transform: uppercase; letter-spacing: .05em; align-self: baseline; }
:is(#panel, .cm-valuetip) .rule {
	--hue: #d55e00;
	position: relative;
	padding: 0 .45rem; border-radius: 1rem; font-size: .72rem; font-weight: 600; white-space: nowrap;
	justify-self: start; min-width: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis;
	font-family: var(--mono);
	color: color-mix(in srgb, var(--hue) 78%, var(--muted));
	border: 1px solid color-mix(in srgb, var(--hue) 22%, var(--border));
	background: color-mix(in srgb, var(--hue) 6%, transparent);
}
:is(#panel, .cm-valuetip, .cm-editor) [data-category="security"] { --hue: #cc0000; }
:is(#panel, .cm-valuetip, .cm-editor) [data-category="bug"] { --hue: #b45309; }
:is(#panel, .cm-valuetip, .cm-editor) [data-category="reproducibility"] { --hue: #7b3294; }
:is(#panel, .cm-valuetip, .cm-editor) [data-category="robustness"] { --hue: #0072b2; }
:is(#panel, .cm-valuetip, .cm-editor) [data-category="deprecated"] { --hue: #8a6a1f; }
:is(#panel, .cm-valuetip, .cm-editor) [data-category="performance"] { --hue: #0072b2; }
:is(#panel, .cm-valuetip, .cm-editor) :is([data-category="style"], [data-category="smell"], [data-category="readability"], [data-category="usability"], [data-category="documentation"]) { --hue: #0f766e; }
:is(#panel, .cm-valuetip, .cm-editor) [data-category="other"] { --hue: var(--muted); }

/* a narrow panel has no room for the chip, the text and the line number side by side, so the text
   moves under the two of them instead of being squeezed into a word per line */
@container panel (max-width: 22rem) {
	#panel .lints { grid-template-columns: minmax(0, 1fr) auto; }
	#panel .lints .lint { grid-template-rows: auto auto; row-gap: .1rem; }
	#panel .rule { grid-column: 1; grid-row: 1; }
	#panel .at { grid-column: 2; grid-row: 1; }
	#panel .says { grid-column: 1 / -1; grid-row: 2; }
	#panel .ddesc { display: none; }
	/* the headings keep their controls, but only the words they need for them */
	#panel .wide, #panel h3 .aside { display: none; }
	#panel .way, #panel h3 .suggest { padding: .1rem .4rem; }
}

/* small motions that answer the pointer, and none of them for someone who asked for less */
@media (prefers-reduced-motion: no-preference) {
	/* the icon moves as one: hovered, the arrow gives the triangle a quarter turn of a push */
	.runicon .turn, .tools svg { transition: transform .3s cubic-bezier(.3, 1.6, .6, 1); }
	#runrgo:not(:disabled):hover .turn, .cm-cell-run:hover .turn { transform: rotate(.25turn); }
	#runrgo.same .badge { animation: pop .35s cubic-bezier(.3, 1.6, .6, 1); }
	/* while R runs, the arrow keeps turning, or the triangle breathes for a run that starts afresh */
	#runrgo:disabled .turn, body:has(#runr.busy) .cm-cell-run .turn { animation: turn 1s linear infinite; }
	#runrgo:disabled:not(.same) .play { animation: breathe 1.2s ease-in-out infinite; }
	/* a reset turns its arrow once around: on the way in, where nothing else competes for the frames, and again
	   on a click or tap; an animation rather than a transition, so leaving does not turn it back */
	.spins:hover svg, .spins.spinning svg { animation: unwind .8s ease-in-out; }
	.tools #share:hover svg { transform: rotate(-20deg); }
	.split[data-fold] > .divider::before { animation: nudge 1.6s ease-in-out 2; display: inline-block; }
}
@keyframes pop { from { transform: scale(0); } }
@keyframes turn { to { transform: rotate(1turn); } }
@keyframes unwind { to { transform: rotate(-1turn); } }
@keyframes breathe { 50% { opacity: .45; } }
@keyframes nudge { 50% { transform: translateX(var(--nudge, .12rem)); } }
.split[data-fold="panel"] > .divider { --nudge: -.12rem; }

@media (max-width: 52rem) {
	body { height: auto; }
	/* a phone has no room to scroll code sideways: long lines wrap, which the editor notices from the style alone */
	#editor .cm-content { white-space: break-spaces; word-break: break-word; overflow-wrap: anywhere; flex-shrink: 1; }
	.split { grid-template-columns: minmax(0, 1fr); }
	.divider { display: none; }
	.pane { border-right: 0; border-bottom: 1px solid var(--border); }
	#editor, #config { min-height: 18rem; }
}
</style>
